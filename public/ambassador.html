<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>AIアンバサダー運用設計 | EXCEED GROUP</title>
<style>
  :root {
    --ink:#0E1330; --ink2:#1A2150; --violet:#6C5CE7; --violet2:#8B7BF0; --violet-soft:#EEEBFD;
    --teal:#1FB6A6; --teal-soft:#E3F7F3; --gold:#C9971C; --gold-soft:#FBF1D9;
    --coral:#E8654F; --coral-soft:#FDECE8; --blue:#3550B0; --blue-soft:#EDF0FF;
    --paper:#F7F8FC; --card:#FFFFFF; --line:rgba(20,28,70,0.10); --line2:rgba(20,28,70,0.18);
    --t1:#12173A; --t2:#5A6288; --t3:#8B92B4;
    --r:14px; --rs:10px;
    --sans:'Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP',sans-serif;
    --serif:'Hiragino Mincho ProN','Yu Mincho',serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#0B0E1A; --card:#141A30; --line:rgba(235,239,255,.10); --line2:rgba(235,239,255,.20);
      --t1:#ECEFF8; --t2:#A4ABC8; --t3:#767E9E;
      --violet-soft:rgba(139,123,240,.16); --teal-soft:rgba(31,182,166,.16); --gold-soft:rgba(224,179,65,.16);
      --coral-soft:rgba(232,101,79,.16); --blue-soft:rgba(83,110,220,.18);
    }
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--sans); background:var(--paper); color:var(--t1); font-size:14px; line-height:1.7; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:1120px; margin:0 auto; padding:0 16px 120px; }
  button, input, select, textarea { font-family:inherit; font-size:inherit; color:inherit; }
  .hidden { display:none !important; }

  /* ---------- Hero ---------- */
  .hero { background:linear-gradient(135deg,#0E1330 0%,#1A2150 55%,#2A2470 100%); color:#fff; padding:26px 0 22px; position:relative; overflow:hidden; }
  .hero::before { content:''; position:absolute; top:-90px; right:-40px; width:300px; height:300px; background:radial-gradient(circle,rgba(108,92,231,.55),transparent 70%); }
  .hero::after { content:''; position:absolute; bottom:-130px; right:160px; width:260px; height:260px; background:radial-gradient(circle,rgba(31,182,166,.38),transparent 70%); }
  .hero .wrap { position:relative; z-index:1; padding-bottom:0; }
  .hero-top { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .eyebrow { font-size:11px; letter-spacing:.26em; color:var(--violet2); font-weight:700; }
  .hero h1 { font-family:var(--serif); font-size:clamp(24px,4vw,34px); font-weight:600; margin-top:12px; line-height:1.3; }
  .hero .sub { color:#B8BEE8; font-size:13px; margin-top:6px; max-width:760px; }
  .hero-meta { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  .pill { display:inline-flex; align-items:center; gap:6px; border:1px solid rgba(255,255,255,.22); border-radius:999px; padding:4px 12px; font-size:12px; color:#DDE1F7; background:rgba(255,255,255,.05); }
  .pill b { color:#fff; }
  .nav-links { display:flex; gap:8px; flex-wrap:wrap; }
  .nav-links a, .nav-links button { color:#fff; text-decoration:none; border:1px solid rgba(255,255,255,.28); border-radius:999px; padding:6px 12px; font-size:12px; font-weight:700; background:none; cursor:pointer; }
  .nav-links a:hover, .nav-links button:hover { background:rgba(255,255,255,.1); }

  /* ---------- Mode switch ---------- */
  .modebar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:18px; }
  .seg { display:inline-flex; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:3px; }
  .seg button { border:none; background:none; color:#C9CEEC; padding:7px 16px; border-radius:999px; font-weight:700; font-size:13px; cursor:pointer; }
  .seg button.on { background:#fff; color:var(--ink); }
  .seg button[disabled] { opacity:.45; cursor:not-allowed; }
  .modehint { font-size:12px; color:#AEB4DC; }
  .user { margin-left:auto; font-size:12px; color:#C9CEEC; display:flex; gap:8px; align-items:center; }
  .user button { background:none; border:1px solid rgba(255,255,255,.25); color:#fff; border-radius:999px; padding:4px 10px; font-size:11px; cursor:pointer; }

  /* ---------- Tabs ---------- */
  .tabs { position:sticky; top:0; z-index:20; background:var(--paper); border-bottom:1px solid var(--line); margin:0 -16px 22px; padding:0 16px; overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tabs-in { display:flex; gap:2px; max-width:1120px; margin:0 auto; }
  .tab { white-space:nowrap; padding:13px 14px; font-size:13px; font-weight:700; border:none; background:none; color:var(--t2); border-bottom:2px solid transparent; margin-bottom:-1px; cursor:pointer; }
  .tab .n { font-size:10px; color:var(--t3); margin-right:5px; letter-spacing:.06em; }
  .tab.on { color:var(--violet); border-bottom-color:var(--violet); }
  .panel { display:none; }
  .panel.on { display:block; animation:fade .25s ease; }
  @keyframes fade { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }

  /* ---------- Common ---------- */
  .sec-head { display:flex; align-items:baseline; gap:12px; margin:6px 0 14px; flex-wrap:wrap; }
  .sec-head h2 { font-family:var(--serif); font-size:22px; font-weight:600; }
  .sec-head .en { font-size:11px; letter-spacing:.22em; color:var(--t3); font-weight:700; }
  .sec-head .lead { width:100%; color:var(--t2); font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:18px 20px; }
  .card + .card { margin-top:14px; }
  .card h3 { font-size:14px; font-weight:700; margin-bottom:10px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  @media (max-width:820px) { .grid2, .grid3 { grid-template-columns:1fr; } }
  .muted { color:var(--t2); }
  .small { font-size:12px; }
  .tag { display:inline-block; font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px; background:var(--violet-soft); color:var(--violet); white-space:nowrap; }
  .tag.teal { background:var(--teal-soft); color:var(--teal); }
  .tag.gold { background:var(--gold-soft); color:var(--gold); }
  .tag.coral { background:var(--coral-soft); color:var(--coral); }
  .tag.blue { background:var(--blue-soft); color:var(--blue); }
  ul.dots { list-style:none; }
  ul.dots li { position:relative; padding-left:14px; margin:3px 0; }
  ul.dots li::before { content:''; position:absolute; left:2px; top:.72em; width:5px; height:5px; border-radius:50%; background:var(--violet2); }
  .scroll-x { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .diagram { min-width:760px; }
  .diagram svg { width:100%; height:auto; display:block; }
  .note { font-size:12px; color:var(--t2); background:var(--violet-soft); border-radius:var(--rs); padding:10px 14px; margin-top:12px; }

  /* ---------- Summary ---------- */
  .purpose { font-family:var(--serif); font-size:clamp(17px,2.4vw,21px); line-height:1.6; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin-top:14px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; border-top:3px solid var(--violet); }
  .kpi:nth-child(2) { border-top-color:var(--teal); } .kpi:nth-child(3) { border-top-color:var(--gold); } .kpi:nth-child(4) { border-top-color:var(--coral); }
  .kpi .l { font-size:12px; color:var(--t2); font-weight:700; }
  .kpi .v { font-family:var(--serif); font-size:24px; font-weight:600; margin-top:2px; }
  .kpi .d { font-size:12px; color:var(--t3); margin-top:2px; }
  .points { counter-reset:pt; list-style:none; margin-top:6px; }
  .points li { counter-increment:pt; position:relative; padding:8px 0 8px 34px; border-bottom:1px dashed var(--line); }
  .points li:last-child { border-bottom:none; }
  .points li::before { content:counter(pt); position:absolute; left:0; top:9px; width:22px; height:22px; border-radius:50%; background:var(--ink); color:#fff; font-size:12px; font-weight:700; display:grid; place-items:center; }

  /* ---------- Decisions ---------- */
  .dec { border:1px solid var(--line); border-radius:var(--r); background:var(--card); padding:16px 18px; display:grid; grid-template-columns:1fr 290px; gap:18px; }
  .dec + .dec { margin-top:12px; }
  @media (max-width:820px) { .dec { grid-template-columns:1fr; } }
  .dec .id { font-size:11px; font-weight:700; color:var(--violet); letter-spacing:.1em; }
  .dec h4 { font-size:15px; margin:2px 0 6px; }
  .dec .row { font-size:13px; margin-top:6px; }
  .dec .row b { display:inline-block; min-width:52px; font-size:11px; color:var(--t3); letter-spacing:.06em; }
  .fb { background:var(--paper); border-radius:var(--rs); padding:12px; }
  .fb .btns { display:flex; gap:6px; flex-wrap:wrap; }
  .fb button { border:1px solid var(--line2); background:var(--card); border-radius:999px; padding:5px 12px; font-size:12px; font-weight:700; cursor:pointer; color:var(--t2); }
  .fb button.on.approve { background:var(--teal); border-color:var(--teal); color:#fff; }
  .fb button.on.hold { background:var(--gold); border-color:var(--gold); color:#fff; }
  .fb button.on.revise { background:var(--coral); border-color:var(--coral); color:#fff; }
  .fb textarea { width:100%; margin-top:8px; min-height:56px; border:1px solid var(--line2); border-radius:8px; padding:8px; background:var(--card); font-size:12px; resize:vertical; }
  .fb .meta { font-size:11px; color:var(--t3); margin-top:4px; min-height:15px; }
  .fb .save { margin-top:6px; }
  .dec-summary { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }

  /* ---------- Courses ---------- */
  .course { border-radius:var(--r); padding:16px 18px; border:1px solid var(--line); background:var(--card); position:relative; overflow:hidden; }
  .course::before { content:''; position:absolute; inset:0 auto 0 0; width:4px; background:var(--violet); }
  .course.b::before { background:var(--teal); }
  .course .k { font-size:11px; font-weight:700; letter-spacing:.14em; color:var(--t3); }
  .course h4 { font-size:17px; margin:2px 0 8px; }
  .course dl { display:grid; grid-template-columns:76px 1fr; gap:4px 10px; font-size:13px; }
  .course dt { color:var(--t3); font-size:12px; font-weight:700; }

  /* ---------- Ops swimlane ---------- */
  .lane-grid { display:grid; gap:6px; }
  .lane-grid .ph { background:var(--ink); color:#fff; border-radius:10px; padding:10px 12px; }
  .lane-grid .ph .t { font-weight:700; font-size:13px; }
  .lane-grid .ph .w { font-size:11px; color:#B8BEE8; }
  .lane-grid .ln { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; font-size:12px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .lane-grid .ln i { width:10px; height:10px; border-radius:3px; flex-shrink:0; }
  .lane-grid .cell { background:var(--card); border:1px dashed var(--line); border-radius:10px; padding:6px; min-height:44px; }
  .task { font-size:12px; line-height:1.5; border-radius:7px; padding:6px 8px; margin:3px 0; border-left:3px solid var(--violet); background:var(--violet-soft); }
  .lane-grid .out { font-size:11px; color:var(--t2); background:var(--gold-soft); border-radius:10px; padding:8px 10px; }
  .lane-grid .out b { color:var(--gold); }
  .ops-mobile { display:none; }
  @media (max-width:900px) { .ops-desktop { display:none; } .ops-mobile { display:block; } }
  .phase-card { border:1px solid var(--line); border-radius:var(--r); background:var(--card); padding:14px; margin-bottom:10px; }
  .phase-card .hd { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; margin-bottom:6px; }
  .phase-card .hd b { font-size:14px; }
  .phase-card .lane-label { font-size:11px; font-weight:700; color:var(--t3); margin-top:6px; }

  /* ---------- Journey ---------- */
  .journey { display:grid; grid-template-columns:repeat(var(--cols,5),1fr); gap:10px; }
  @media (max-width:900px) { .journey { grid-template-columns:1fr; } .mood-svg { display:none; } }
  .step { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px; display:flex; flex-direction:column; gap:8px; }
  .step .no { font-size:11px; font-weight:700; color:var(--teal); letter-spacing:.12em; }
  .step h4 { font-size:14px; line-height:1.4; }
  .step .per { font-size:11px; color:var(--t3); }
  .step .box { border-radius:8px; padding:8px 10px; font-size:12px; }
  .step .box .l { font-size:10px; font-weight:700; letter-spacing:.1em; margin-bottom:2px; }
  .step .feel { background:var(--teal-soft); }
  .step .feel .l { color:var(--teal); }
  .step .sup { background:var(--blue-soft); }
  .step .sup .l { color:var(--blue); }
  .step .proof { background:var(--gold-soft); }
  .step .proof .l { color:var(--gold); }

  /* ---------- Rules / tables ---------- */
  .rule-group + .rule-group { margin-top:16px; }
  .rule-group > h3 { font-size:13px; letter-spacing:.06em; color:var(--t2); margin:0 0 8px; }
  .rule { display:grid; grid-template-columns:54px 1fr; gap:12px; padding:12px 14px; background:var(--card); border:1px solid var(--line); border-radius:var(--rs); }
  .rule + .rule { margin-top:6px; }
  .rule .no { font-weight:700; color:var(--violet); font-size:12px; letter-spacing:.06em; padding-top:1px; }
  .rule .t { font-weight:700; }
  .rule .b { color:var(--t2); font-size:13px; margin-top:2px; }
  table.tbl { width:100%; border-collapse:collapse; font-size:13px; background:var(--card); }
  .tbl th { text-align:left; font-size:11px; letter-spacing:.06em; color:var(--t3); padding:9px 10px; border-bottom:1px solid var(--line2); white-space:nowrap; }
  .tbl td { padding:10px; border-bottom:1px solid var(--line); vertical-align:top; }
  .tbl tr:last-child td { border-bottom:none; }
  .tbl-wrap { border:1px solid var(--line); border-radius:var(--r); overflow:auto; }

  /* ---------- Playbook ---------- */
  .timeline { position:relative; padding-left:22px; }
  .timeline::before { content:''; position:absolute; left:7px; top:6px; bottom:6px; width:2px; background:var(--line2); }
  .tl { position:relative; padding:0 0 14px; }
  .tl::before { content:''; position:absolute; left:-20px; top:6px; width:12px; height:12px; border-radius:50%; background:var(--card); border:3px solid var(--violet); }
  .tl .when { font-size:12px; font-weight:700; color:var(--violet); }
  .tl .what { font-weight:700; }
  .tl .how { font-size:12px; color:var(--t2); }
  .half { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; }
  @media (max-width:820px) { .half { grid-template-columns:1fr 1fr; } }
  .mon { border-radius:10px; padding:10px; background:var(--card); border:1px solid var(--line); }
  .mon .m { font-size:11px; font-weight:700; color:var(--t3); }
  .mon .t { font-weight:700; font-size:13px; margin:2px 0; }
  .mon .d { font-size:12px; color:var(--t2); }
  .mon.key { border-color:var(--violet); box-shadow:inset 0 0 0 1px var(--violet); }
  .msg { border-left:3px solid var(--teal); padding:8px 12px; background:var(--card); border-radius:0 var(--rs) var(--rs) 0; }
  .msg + .msg { margin-top:8px; }
  .msg .t { font-weight:700; font-size:13px; }
  .msg .b { font-size:13px; color:var(--t2); white-space:pre-wrap; }

  /* ---------- Bench ---------- */
  .bench { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px; display:flex; flex-direction:column; gap:6px; }
  .bench .co { font-weight:700; font-size:15px; }
  .bench .what { font-size:13px; color:var(--t2); }
  .bench .lesson { font-size:13px; font-weight:700; }
  .bench .apply { font-size:12px; background:var(--teal-soft); border-radius:8px; padding:8px 10px; }
  .bench .apply b { color:var(--teal); }
  .bench a { font-size:11px; color:var(--blue); word-break:break-all; }

  /* ---------- Gate / states ---------- */
  .gate { max-width:560px; margin:40px auto; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:32px 24px; }
  .gate h2 { font-size:18px; margin-bottom:8px; }
  .gate p { color:var(--t2); font-size:13px; margin-bottom:16px; }
  .btn { border:1px solid var(--line2); background:var(--card); color:var(--t1); border-radius:999px; padding:9px 18px; font-weight:700; cursor:pointer; font-size:13px; }
  .btn.primary { background:var(--violet); border-color:var(--violet); color:#fff; }
  .btn.danger { color:var(--coral); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .err { color:var(--coral); font-size:12px; margin-top:10px; }

  /* ---------- Edit mode ---------- */
  body.editing [data-path] { outline:1px dashed rgba(108,92,231,.45); outline-offset:2px; border-radius:4px; cursor:text; min-width:1em; display:inline-block; }
  body.editing div[data-path], body.editing p[data-path] { display:block; }
  body.editing [data-path]:focus { outline:2px solid var(--violet); background:var(--violet-soft); }
  body.editing [data-path]:empty::before { content:'（未入力）'; color:var(--t3); }
  .ed { display:none !important; }
  body.editing .ed { display:inline-flex !important; }
  .mini { border:1px solid var(--line2); background:var(--card); border-radius:999px; padding:2px 9px; font-size:11px; font-weight:700; cursor:pointer; color:var(--t2); align-items:center; gap:3px; }
  .mini.add { color:var(--violet); border-color:rgba(108,92,231,.4); margin-top:8px; }
  .mini.del { color:var(--coral); }
  .mini-sel { font-size:11px; border:1px solid var(--line2); border-radius:6px; padding:1px 4px; background:var(--card); }
  .savebar { position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--ink); color:#fff; padding:10px 16px; box-shadow:0 -6px 24px rgba(0,0,0,.18); }
  .savebar .in { max-width:1120px; margin:0 auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .savebar .st { font-size:12px; color:#C9CEEC; margin-right:auto; }
  .savebar .st b { color:var(--gold); }
  .savebar input[type=text] { border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08); color:#fff; border-radius:999px; padding:7px 12px; font-size:12px; width:240px; max-width:100%; }
  .savebar .btn { background:transparent; color:#fff; border-color:rgba(255,255,255,.3); padding:7px 14px; font-size:12px; }
  .savebar .btn.primary { background:var(--violet); border-color:var(--violet); }
  .toast { position:fixed; right:16px; bottom:76px; z-index:40; background:var(--ink); color:#fff; padding:10px 14px; border-radius:10px; font-size:13px; box-shadow:0 6px 24px rgba(0,0,0,.25); opacity:0; transform:translateY(8px); transition:.25s; pointer-events:none; }
  .toast.show { opacity:1; transform:none; }
  .banner { margin:0 0 16px; font-size:12px; border-radius:var(--rs); padding:10px 14px; background:var(--gold-soft); color:var(--t1); }

  @media print {
    .hero { background:#fff !important; color:#000; padding:0 0 10px; }
    .hero::before, .hero::after, .tabs, .modebar, .nav-links, .savebar, .fb .btns, .fb textarea, .fb .save, .ed, .toast { display:none !important; }
    .hero h1, .hero .sub { color:#000; }
    .pill { color:#000; border-color:#999; }
    .panel { display:block !important; page-break-before:always; }
    .panel:first-of-type { page-break-before:avoid; }
    .ops-desktop { display:block !important; } .ops-mobile { display:none !important; }
    .diagram { min-width:0; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="hero-top">
      <div class="eyebrow">EXCEED GROUP / AI AMBASSADOR PROGRAM</div>
      <nav class="nav-links" aria-label="ページナビゲーション">
        <a href="./dashboard.html">活用ダッシュボード</a>
        <a href="./form.html">事例を投稿</a>
        <a href="./admin.html">管理者ページ</a>
        <button type="button" id="print-btn">印刷 / PDF</button>
      </nav>
    </div>
    <h1 id="h-title">AIアンバサダー制度 運用設計</h1>
    <p class="sub" id="h-sub">ログインすると内容が表示されます。</p>
    <div class="hero-meta" id="h-meta"></div>
    <div class="modebar">
      <div class="seg" role="group" aria-label="表示モード">
        <button type="button" id="mode-view" class="on">提案モード</button>
        <button type="button" id="mode-edit" disabled title="管理者のみ">修正モード</button>
      </div>
      <span class="modehint" id="mode-hint">提案モード：社長確認用の閲覧表示です。判断事項に「承認／保留／要修正」とコメントを残せます。</span>
      <div class="user" id="user-box"></div>
    </div>
  </div>
</header>

  <div id="gate" class="gate">

/* ---------------- path helpers ---------------- */
function getPath(obj, path){ return path.split('.').reduce((o,k)=> o==null ? o : o[k], obj); }
function setPath(obj, path, val){
  const ks = path.split('.'); const last = ks.pop();
  const parent = ks.reduce((o,k)=> o[k], obj); parent[last] = val;
}
const tplKey = path => path.split('.').filter(k => !/^\d+$/.test(k)).join('.');

// 編集可能テキスト。修正モードでは contenteditable になる
function T(path, tag='span', cls=''){
  const v = getPath(content, path);
  const ce = mode === 'edit' ? ' contenteditable="plaintext-only" spellcheck="false"' : '';
  return `<${tag} class="${cls}" data-path="${esc(path)}"${ce}>${esc(v)}</${tag}>`;
}
const addBtn = (path, label='追加') => `<button type="button" class="mini add ed" data-add="${esc(path)}">＋ ${esc(label)}</button>`;
const delBtn = path => `<button type="button" class="mini del ed" data-del="${esc(path)}" title="削除">×</button>`;
const arr = path => getPath(content, path) || [];

}

    <textarea data-fbc="${esc(id)}" maxlength="2000" placeholder="コメント（任意）">${esc(f.comment || '')}</textarea>

/* --- 01 全体マップ（SVG） --- */
function box(x,y,w,h,fill,stroke,lines,opts={}){
  // 2行目以降は箱の幅に合わせて折り返す（日本語は1文字≒12px）
  const max = Math.max(4, Math.floor((w - 16) / 12.5));
  lines = lines.filter(l => l !== '').flatMap((l,i) => {
    if(i === 0) return [l];
    const out = []; for(let k = 0; k < l.length; k += max) out.push(l.slice(k, k + max)); return out;
  });
  const ty = y + h/2 - (lines.length-1)*9;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>`
    + lines.map((l,i)=>`<text x="${x+w/2}" y="${ty+i*18}" text-anchor="middle" dominant-baseline="middle" font-size="${i===0?(opts.fs||14):12}" font-weight="${i===0?700:400}" fill="${opts.color||'currentColor'}">${esc(l)}</text>`).join('');
}
function arrow(d, color='#8B92B4', dash=false, label='', lx=0, ly=0){
  return `<path d="${d}" fill="none" stroke="${color}" stroke-width="1.8" ${dash?'stroke-dasharray="5 4"':''} marker-end="url(#ah)"/>`
    + (label ? `<text x="${lx}" y="${ly}" font-size="11" text-anchor="middle" fill="${color}" font-weight="700">${esc(label)}</text>` : '');
}

/* --- 02 運営側マップ（スイムレーン） --- */
function renderOps(){
  const lanes = arr('ops.lanes'), phases = arr('ops.phases');
  const color = id => LANE_COLORS[Math.max(0, lanes.findIndex(l => l.id === id)) % LANE_COLORS.length];
  const laneSel = (pi,ti,cur) => `<select class="mini-sel ed" data-lane="ops.phases.${pi}.tasks.${ti}.lane">${lanes.map(l=>`<option value="${esc(l.id)}"${l.id===cur?' selected':''}>${esc(l.name)}</option>`).join('')}</select>`;
  const taskHtml = (t,pi,ti) => `<div class="task" style="border-left-color:${color(t.lane)};background:color-mix(in srgb, ${color(t.lane)} 10%, transparent)">${T(`ops.phases.${pi}.tasks.${ti}.text`)} ${laneSel(pi,ti,t.lane)} ${delBtn(`ops.phases.${pi}.tasks.${ti}`)}</div>`;
  const cols = `150px repeat(${phases.length}, minmax(150px,1fr))`;
  let grid = `<div class="lane-grid" style="grid-template-columns:${cols}"><div></div>`;
  grid += phases.map((p,pi)=>`<div class="ph"><div class="t">${T(`ops.phases.${pi}.title`)} ${delBtn(`ops.phases.${pi}`)}</div><div class="w">${T(`ops.phases.${pi}.timing`)}</div></div>`).join('');
  lanes.forEach((l,li)=>{
    grid += `<div class="ln"><i style="background:${color(l.id)}"></i>${T(`ops.lanes.${li}.name`)}</div>`;
    grid += phases.map((p,pi)=>`<div class="cell">${(p.tasks||[]).map((t,ti)=> t.lane===l.id ? taskHtml(t,pi,ti) : '').join('')}</div>`).join('');
  });
  grid += `<div class="ln" style="background:var(--gold-soft)">成果物</div>` + phases.map((p,pi)=>`<div class="out"><b>OUTPUT</b><br>${T(`ops.phases.${pi}.output`)}</div>`).join('');
  grid += `<div></div>` + phases.map((p,pi)=>`<div>${addBtn(`ops.phases.${pi}.tasks`,'タスク')}</div>`).join('');
  grid += `</div>`;
  const mobile = phases.map((p,pi)=>`
    <div class="phase-card"><div class="hd"><span class="tag">${esc('PHASE '+(pi+1))}</span><b>${esc(p.title)}</b><span class="small muted">${esc(p.timing)}</span></div>
    <div class="small muted">${esc(p.goal)}</div>
    ${lanes.map(l=>{ const ts=(p.tasks||[]).filter(t=>t.lane===l.id); return ts.length ? `<div class="lane-label">${esc(l.name)}</div>`+ts.map(t=>`<div class="task" style="border-left-color:${color(l.id)}">${esc(t.text)}</div>`).join('') : ''; }).join('')}
    <div class="task" style="border-left-color:var(--gold);background:var(--gold-soft)"><b>成果物：</b>${esc(p.output)}</div></div>`).join('');
  $('p-ops').innerHTML = `
    ${head('運営側マップ','OPERATIONS','ops.lead')}
    <div class="card"><h3>フェーズごとの狙い</h3><div class="grid3">${phases.map((p,pi)=>`<div><span class="tag">PHASE ${pi+1}</span> <b>${esc(p.title)}</b><div class="small muted" style="margin-top:4px">${T(`ops.phases.${pi}.goal`,'div')}</div></div>`).join('')}</div>${addBtn('ops.phases','フェーズを追加')}</div>
    <div class="card ops-desktop scroll-x" style="margin-top:14px"><div style="min-width:${150+phases.length*160}px">${grid}</div>
      <div class="small muted" style="margin-top:10px">${lanes.map((l,li)=>`<span class="ed" style="margin-right:10px">${T(`ops.lanes.${li}.name`)} ${delBtn(`ops.lanes.${li}`)}</span>`).join('')}${addBtn('ops.lanes','担当レーンを追加')}</div></div>
    <div class="ops-mobile" style="margin-top:14px">${mobile}</div>`;
}

/* --- 03 アンバサダー側マップ --- */
function renderJourney(){
  const js = arr('journey'); const n = js.length || 1;
  const W = 1000, H = 120, pad = W/(n*2);
  const pts = js.map((s,i)=>[pad + i*(W/n), 100 - (Math.min(5,Math.max(1,Number(s.mood)||3))-1)*20]);

/* ---------------- interactions ---------------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('button, [data-tab]');
  if(!t) return;
  if(t.dataset.tab){
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === t.dataset.tab));
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b === t));
    window.scrollTo({ top: $('app').offsetTop - 4, behavior:'smooth' });
    return;
  }
  if(t.dataset.add){
    const list = getPath(content, t.dataset.add);
    const tpl = TEMPLATES[tplKey(t.dataset.add)];
    if(Array.isArray(list)){ list.push(clone(tpl ?? '')); markDirty(); renderAll(); }
    return;
  }
  if(t.dataset.del){
    const ks = t.dataset.del.split('.'); const idx = Number(ks.pop());
    const list = getPath(content, ks.join('.'));
    if(Array.isArray(list) && confirm('この項目を削除しますか？（保存するまで確定しません）')){ list.splice(idx,1); markDirty(); renderAll(); }
    return;
  }
  if(t.dataset.fb){ await saveFeedback(t.dataset.fb, t.dataset.st); return; }
  if(t.dataset.fbsave){ await saveFeedback(t.dataset.fbsave, null); return; }
  if(t.dataset.restore != null){
    const h = historyRows[Number(t.dataset.restore)];
    if(dirty && !confirm('未保存の変更があります。破棄してこの版を開きますか？')) return;
    try { content = JSON.parse(h.content); setMode('edit'); markDirty(); toast(`v${h.version} を読み込みました。保存すると新しい版になります。`); } catch(err){ toast('この版を読み込めませんでした'); }
    return;
  }
  if(t.id === 'viewers-save'){ await saveViewers(); return; }
});

function markDirty(){ dirty = true; $('save-state').innerHTML = '<b>●</b> 未保存の変更があります'; }
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2600); }

function setMode(m){
  mode = m;
  $('mode-view').classList.toggle('on', m === 'view');
  $('mode-edit').classList.toggle('on', m === 'edit');
  $('savebar').classList.toggle('hidden', m !== 'edit');
  $('mode-hint').textContent = m === 'edit'
    ? '修正モード：点線の文字をクリックして直接書き換えられます。「保存する」で新しい版として記録されます。'
    : '提案モード：社長確認用の閲覧表示です。判断事項に「承認／保留／要修正」とコメントを残せます。';
  if(m === 'edit') $('save-state').innerHTML = dirty ? '<b>●</b> 未保存の変更があります' : '修正モード（変更なし）';
  renderAll();
}
$('mode-view').onclick = () => {
  if(dirty && !confirm('未保存の変更があります。提案モードに戻ると変更は破棄されます。よろしいですか？')) return;
  if(dirty){ content = clone(saved); dirty = false; }
  setMode('view');
};
$('mode-edit').onclick = () => { if(isAdmin) setMode('edit'); };
$('print-btn').onclick = () => window.print();
window.addEventListener('beforeunload', e => { if(dirty){ e.preventDefault(); e.returnValue = ''; } });

$('btn-discard').onclick = () => {
  if(!dirty || confirm('保存していない変更を破棄します。よろしいですか？')){ content = clone(saved); dirty = false; setMode('edit'); }
};
$('btn-export').onclick = () => {
  const blob = new Blob([JSON.stringify(content, null, 2)], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `ambassador-${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(a.href);
};
$('btn-import').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if(!f) return;
  try {
    const data = JSON.parse(await f.text());
    if(!data.meta || !data.summary || !Array.isArray(data.decisions)) throw new Error('形式が違います');
    content = data; markDirty(); renderAll(); toast('JSONを読み込みました。「保存する」で確定します。');
  } catch(err){ toast('読み込めませんでした：' + err.message); }
};
$('btn-save').onclick = saveContent;

async function saveContent(){
  if(!dirty){ toast('変更はありません'); return; }
  if(LOCAL){ saved = clone(content); dirty = false; setMode('edit'); toast('ローカル確認モードのため保存は画面内のみです'); return; }
  $('btn-save').disabled = true;
  try {
    const cur = await getDoc(PROPOSAL);
    const curVer = cur.exists() ? (cur.data().version || 0) : 0;
    if(curVer !== docVersion && !confirm(`他の人が先に v${curVer} を保存しています。上書きしますか？（相手の変更は履歴に残ります）`)) return;
    const rec = {
      content: JSON.stringify(content),
      version: curVer + 1,
      note: $('save-note').value.trim(),
      updatedBy: user.email.toLowerCase(),
      updatedByName: user.displayName || '',
      updatedAt: serverTimestamp(),
    };
    await setDoc(PROPOSAL, rec);
    await addDoc(collection(db, 'aiStudy_ambassadorHistory'), rec);
    docVersion = rec.version; saved = clone(content); dirty = false; $('save-note').value = '';
    docMeta = { updatedAt: Date.now(), updatedByName: rec.updatedByName || rec.updatedBy };
    await loadHistory(); setMode('edit'); toast(`v${rec.version} として保存しました`);
  } catch(err){ console.error(err); toast('保存に失敗しました：' + (err.code || err.message)); }
  finally { $('btn-save').disabled = false; }
}

async function saveFeedback(id, status){
  const cur = feedback[id] || {};
  const ta = document.querySelector(`[data-fbc="${CSS.escape(id)}"]`);
  const rec = {
    status: status ? (cur.status === status ? 'none' : status) : (cur.status || 'none'),
    comment: ta ? ta.value.trim() : (cur.comment || ''),
    by: (user?.email || 'local').toLowerCase(), byName: user?.displayName || 'ローカル確認', at: Date.now(),
  };
  feedback[id] = rec; renderSummary();
  if(LOCAL){ toast('ローカル確認モード：判断は画面内のみ'); return; }
  try {
    await setDoc(doc(db, 'aiStudy_ambassadorFeedback', id), { ...rec, at: serverTimestamp() });
    toast('判断・コメントを保存しました');
  } catch(err){ console.error(err); toast('保存に失敗しました：' + (err.code || err.message)); }
}

async function saveViewers(){
  const list = [...new Set($('viewers').value.split(/[\s,]+/).map(s => s.trim().toLowerCase()).filter(s => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s)))];
  try { await updateDoc(ACCESS, { proposalViewers: list }); viewers = list; renderAdmin(); toast(`閲覧者を ${list.length} 名で保存しました`); }
  catch(err){ console.error(err); toast('保存に失敗しました：' + (err.code || err.message)); }
}

async function loadHistory(){
  if(!isAdmin || LOCAL) return;
  try {
    const snap = await getDocs(query(collection(db,'aiStudy_ambassadorHistory'), orderBy('updatedAt','desc'), limit(20)));
    historyRows = snap.docs.map(d => d.data());
  } catch(err){ console.warn(err); }
}

/* ---------------- load ---------------- */
async function loadAll(){
  // 管理者判定: access ドキュメントはルール上 admins しか読めない
  try { const a = await getDoc(ACCESS); isAdmin = a.exists(); viewers = a.exists() ? (a.data().proposalViewers || []) : []; }
  catch(err){ isAdmin = false; }
  $('mode-edit').disabled = !isAdmin;
  $('mode-edit').title = isAdmin ? '' : '管理者のみ修正できます';

  let snap;
  try { snap = await getDoc(PROPOSAL); }
  catch(err){
    showGate('閲覧権限がありません', `このアカウント（${user.email}）は閲覧者に登録されていません。社長室に閲覧者登録を依頼してください。`);
    return;
  }
  if(snap.exists()){
    const d = snap.data();
    try { content = JSON.parse(d.content); } catch(err){ content = null; }
    docVersion = d.version || 0;
    docMeta = { updatedAt: d.updatedAt?.toDate ? d.updatedAt.toDate().getTime() : null, updatedByName: d.updatedByName || d.updatedBy };
  }
  if(!content){
    if(isAdmin){
      content = emptyContent(); saved = clone(content); showApp(); setMode('edit');
      toast('まだ本文がありません。下の「JSON読込」で初期データを取り込んでください。');
    } else {
      showGate('準備中です', '社長室が内容を登録するまでお待ちください。');
    }
    return;
  }
  saved = clone(content);
  try { (await getDocs(collection(db,'aiStudy_ambassadorFeedback'))).forEach(f => { const x = f.data(); feedback[f.id] = { ...x, at: x.at?.toDate ? x.at.toDate().getTime() : null }; }); }
  catch(err){ console.warn(err); }
  await loadHistory();
  showApp(); setMode('view');
}

function emptyContent(){
  return { meta:{title:'AIアンバサダー制度 運用設計',subtitle:'',version:'',status:'',owner:''},
    summary:{purpose:'',points:[],kpis:[]}, decisions:[], courses:[{id:'A'},{id:'B'}],
    map:{lead:'',monthly:'',half:'',graduate:''}, ops:{lead:'',lanes:[],phases:[]}, journeyLead:'', journey:[],
    rulesLead:'', rules:[], standards:{lead:'',metrics:[],scoreNote:'',judge:{gate:'',promote:'',keep:'',yellow:'',graduate:'',early:''}},
    playbook:{lead:'',monthly:[],half:[],messages:[]}, benchLead:'', benchmarks:[], systemsLead:'', systems:[], risks:[], next:[] };
}

function showGate(title, msg){
  $('gate').classList.remove('hidden'); $('app').classList.add('hidden');
  $('gate').innerHTML = `<h2>${esc(title)}</h2><p>${esc(msg)}</p>${user ? '<button class="btn" id="gate-logout" type="button">別のアカウントでログイン</button>' : ''}`;
  const b = $('gate-logout'); if(b) b.onclick = () => signOut(auth);
}
function showApp(){ $('gate').classList.add('hidden'); $('app').classList.remove('hidden'); }

async function login(){
  $('gate-err').textContent = '';
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch(err){ if(err.code !== 'auth/popup-closed-by-user') $('gate-err').textContent = 'ログインに失敗しました：' + err.message; }
}
$('login-btn').onclick = login;

if(LOCAL){
  isAdmin = true; $('mode-edit').disabled = false;
  $('user-box').innerHTML = '<span>ローカル確認</span>';
  fetch('./ambassador-seed.local.json').then(r => r.json()).then(d => {
    content = d; saved = clone(d); docMeta = {}; showApp(); setMode('view');
  }).catch(() => showGate('ローカルデータがありません', 'public/ambassador-seed.local.json を配置してください。'));
} else {
  onAuthStateChanged(auth, async u => {
    user = u; feedback = {}; content = null; dirty = false;
    if(!u){
      $('user-box').innerHTML = '';
      $('gate').classList.remove('hidden'); $('app').classList.add('hidden');
      $('gate').innerHTML = GATE_HTML; $('login-btn').onclick = login;
      return;
    }
    $('user-box').innerHTML = `<span>${esc(u.email)}</span><button type="button" id="logout">ログアウト</button>`;
    $('logout').onclick = () => { if(!dirty || confirm('未保存の変更は破棄されます。ログアウトしますか？')) signOut(auth); };
    $('gate').innerHTML = '<p class="muted">読み込み中…</p>';
    await loadAll();
  });
}
</script>
</body>
</html>
