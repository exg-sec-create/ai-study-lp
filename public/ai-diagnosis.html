<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI QUEST｜社内AI活用レベル診断</title><meta name="description" content="毎日のAI活用を5段階で楽しく診断する社内向けチェックです。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#15212b;--muted:#68747e;--paper:#f7f4ed;--card:#fff;--lime:#c9ff53;--purple:#7559ff;--coral:#ff745c;--line:#dfe2dc}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans JP",sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#15212b14 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(to bottom,#000,transparent 70%)}button,input,select,textarea{font:inherit}.shell{width:min(920px,calc(100% - 32px));margin:auto;padding:28px 0 80px;position:relative}.top{display:flex;justify-content:space-between;align-items:center}.logo{font:900 17px "DM Sans";letter-spacing:.08em}.logo i{display:inline-block;width:13px;height:13px;background:var(--lime);border:3px solid var(--ink);border-radius:50%;margin-right:8px}.secure{font-size:12px;color:var(--muted)}.hero{padding:70px 0 46px}.kicker{display:inline-block;background:var(--ink);color:#fff;padding:7px 13px;border-radius:99px;font:700 11px "DM Sans";letter-spacing:.16em}.hero h1{font-size:clamp(43px,9vw,86px);line-height:1.02;letter-spacing:-.055em;margin:20px 0}.hero h1 em{font-style:normal;color:var(--purple)}.hero p{max-width:570px;color:var(--muted);line-height:1.9}.facts{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}.fact{background:#fff;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:12px 17px;border-radius:12px;font-size:13px;font-weight:700}.panel{background:var(--card);border:2px solid var(--ink);box-shadow:7px 7px 0 var(--ink);border-radius:22px;padding:clamp(22px,5vw,48px)}.gate{text-align:center}.gate .orb{font-size:50px}.gate p{color:var(--muted);line-height:1.8}.primary{border:2px solid var(--ink);background:var(--lime);box-shadow:4px 4px 0 var(--ink);border-radius:12px;padding:14px 24px;font-weight:900;cursor:pointer;transition:.15s}.primary:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}.primary:disabled{opacity:.45}.error{color:#c53728;font-size:13px;margin-top:12px}.hidden{display:none!important}.game-head{position:sticky;top:10px;z-index:5;background:#fff;border:2px solid var(--ink);border-radius:16px;padding:13px 16px;margin-bottom:22px;display:flex;align-items:center;gap:14px}.bar{height:10px;background:#e9e9e5;flex:1;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--purple));width:0;transition:.3s}.step{font:700 12px "DM Sans";white-space:nowrap}.stage-label{font-size:12px;font-weight:900;color:var(--purple)}.question h2{font-size:clamp(24px,5vw,36px);line-height:1.45;margin:0 0 8px}.question .hint{color:var(--muted);font-size:13px;margin-bottom:25px}.choices{display:grid;gap:10px}.choice input{position:absolute;opacity:0}.choice label{display:flex;align-items:center;gap:14px;padding:14px 16px;border:2px solid var(--line);border-radius:13px;cursor:pointer;transition:.15s}.choice label b{display:grid;place-items:center;min-width:34px;height:34px;background:#f0f0ec;border-radius:9px;font:900 13px "DM Sans"}.choice input:checked+label{border-color:var(--purple);background:#f0edff;transform:translateX(4px)}.choice input:focus-visible+label{outline:3px solid #b9aefc}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:28px}.backbtn{border:0;background:none;text-decoration:underline;cursor:pointer;color:var(--muted)}.field{width:100%;border:2px solid var(--line);border-radius:12px;padding:13px;background:#fff}.result{text-align:center}.level-badge{width:150px;height:150px;margin:auto;border:3px solid var(--ink);border-radius:50%;background:var(--lime);box-shadow:7px 7px 0 var(--ink);display:grid;place-content:center}.level-badge span{font:900 13px "DM Sans"}.level-badge strong{font:900 56px/1 "DM Sans"}.result h2{font-size:clamp(30px,6vw,50px);margin:24px 0 8px}.result-lead{color:var(--muted);max-width:590px;margin:0 auto 28px;line-height:1.9}.scoreline{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.pill{border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-size:12px}.skills{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:left;margin:30px 0}.skill{padding:15px;background:#f7f6f2;border-radius:12px}.skill span{font-size:12px}.skill i{display:block;height:7px;background:#ddd;border-radius:9px;margin-top:7px;overflow:hidden}.skill i:after{content:"";display:block;width:var(--w);height:100%;background:var(--purple)}.next{background:var(--ink);color:#fff;text-align:left;padding:22px;border-radius:16px}.next b{color:var(--lime)}.save{margin-top:22px;color:var(--muted);font-size:12px}@media(max-width:600px){.hero{padding-top:45px}.secure{display:none}.panel{box-shadow:4px 4px 0 var(--ink)}.skills{grid-template-columns:1fr}.game-head{top:5px}.stage-label{display:none}}
</style></head><body><main class="shell"><header class="top"><div class="logo"><i></i>AI QUEST</div><div class="secure">社内限定 · 約5分 · 全16問</div></header>
<section class="hero"><span class="kicker">AI SKILL CHECK 2026</span><h1>あなたのAI活用、<br><em>いま何レベル？</em></h1><p>Geminiを中心に、頻度・使い方・工夫・安全性をチェック。誰かと比べるためではなく、次の一歩を見つけるための診断です。</p><div class="facts"><div class="fact">⚡ 16 QUESTS</div><div class="fact">🏆 LEVEL 1—5</div><div class="fact">🔒 本人＋管理者のみ</div></div></section>
<section id="gate" class="panel gate"><div class="orb">🪐</div><h2>冒険をはじめよう</h2><p>会社のGoogleアカウントでログインしてください。<br>回答は人事評価を目的とせず、AI活用支援の参考として集計します。</p><button id="login" class="primary">Googleでログインしてスタート →</button><div id="gateError" class="error" role="alert"></div></section>
<section id="game" class="hidden"><div class="game-head"><span id="stage" class="stage-label">BASICS</span><div class="bar"><span id="progress"></span></div><span id="counter" class="step">01 / 16</span></div><div class="panel question"><h2 id="qTitle"></h2><p id="qHint" class="hint"></p><div id="answer"></div><div class="nav"><button id="prev" class="backbtn">← もどる</button><button id="next" class="primary">次へ →</button></div><div id="answerError" class="error"></div></div></section>
<section id="result" class="panel result hidden"><div class="level-badge"><span>LEVEL</span><strong id="level">—</strong></div><h2 id="levelName"></h2><p id="levelLead" class="result-lead"></p><div class="scoreline"><span id="score" class="pill"></span><span class="pill">回答は最新結果に更新</span></div><div id="skills" class="skills"></div><div class="next"><b>NEXT QUEST</b><p id="advice"></p></div><p id="saveState" class="save">結果を保存しています…</p><button class="primary" onclick="location.reload()">もう一度診断する</button></section></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";import{getFirestore,doc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";import{firebaseConfig}from"./firebase-config.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider(),$=id=>document.getElementById(id);provider.setCustomParameters({prompt:"select_account"});let user,index=0;const answers={};
const scale=(a,b,c,d,e)=>[a,b,c,d,e].map((label,i)=>({label,score:i}));
const questions=[
{id:"frequency",cat:"習慣",title:"Geminiを、1日にどれくらい使いますか？",hint:"仕事で実際に利用する平均的な日を思い浮かべてください。",options:scale("使わない","1回未満／週に数回","1〜2回","3〜5回","6回以上")},
{id:"scenes",cat:"習慣",title:"どれくらい幅広い業務で使っていますか？",hint:"文章、調査、要約、企画、分析などの広がりを確認します。",options:scale("まだ使っていない","1つの用途だけ","2つの用途","3〜4つの用途","5つ以上／業務の標準")},
{id:"firstChoice",cat:"習慣",title:"仕事を始めるとき、AIを選択肢に入れますか？",hint:"困ったときだけでなく、自然に思い出せるかをチェック。",options:scale("入れない","ほぼ入れない","時々入れる","よく入れる","常に最適手段として検討")},
{id:"prompt",cat:"使い方",title:"目的や条件を整理して依頼できますか？",hint:"役割・背景・出力形式・制約を伝える力です。",options:scale("短い単語だけ","目的だけ伝える","背景も伝える","形式や条件も指定","例示しながら改善できる")},
{id:"iterate",cat:"使い方",title:"回答がいまひとつな時、どうしますか？",hint:"一度の回答で終わらせず対話できるかを確認します。",options:scale("諦める","同じ質問を繰り返す","少し言い換える","不足点を伝えて修正","分解・比較・検証を重ねる")},
{id:"workspace",cat:"使い方",title:"WorkspaceとGeminiを連携して使えますか？",hint:"Gmail、Docs、Sheets、Drive、Meet等での活用です。",options:scale("知らない","知っているが未使用","1サービスで使用","複数サービスで使用","業務フローに定着")},
{id:"quality",cat:"成果",title:"AIで作業の質や速さは変わりましたか？",hint:"時間短縮だけでなく、抜け漏れやアイデアの質も含みます。",options:scale("変化なし","まだ分からない","少し改善","明確に改善","大幅改善・成果を説明できる")},
{id:"reuse",cat:"成果",title:"よい使い方を再利用できる形で残していますか？",hint:"プロンプト、テンプレート、手順書など。",options:scale("残していない","個人メモ程度","時々再利用","整理して継続利用","チームで共有・改善")},
{id:"advanced",cat:"成果",title:"複数ステップの仕事にもAIを使いますか？",hint:"調査→整理→下書き→レビューのような一連の流れです。",options:scale("使わない","単発作業のみ","2工程で使う","複数工程で使う","ワークフロー全体を設計")},
{id:"verify",cat:"安全",title:"AIの回答を確認してから使っていますか？",hint:"事実、数字、引用元、最新性のチェックです。",options:scale("そのまま使う","ほぼ確認しない","重要箇所だけ確認","根拠を確認","複数情報源で検証・明示")},
{id:"security",cat:"安全",title:"入力してよい情報を判断できますか？",hint:"機密情報・個人情報と社内ルールへの理解です。",options:scale("意識していない","少し不安","基本は理解","入力前に必ず判断","周囲にも注意点を説明")},
{id:"ownership",cat:"安全",title:"最終責任は自分にあると意識していますか？",hint:"AIは補助役。成果物の判断と説明は人が担います。",options:scale("意識していない","あまり意識しない","理解している","常に見直す","判断理由も説明できる")},
{id:"share",cat:"協働",title:"AI活用のコツを周囲に共有しますか？",hint:"小さな成功・失敗の共有も含みます。",options:scale("共有しない","聞かれた時だけ","時々共有","積極的に共有","相談に乗りチームを支援")},
{id:"experiment",cat:"協働",title:"新しい使い方を試す習慣がありますか？",hint:"安全な範囲で、小さく試して学ぶ姿勢です。",options:scale("試さない","年に数回","月に1回","週に1回","日常的に試して振り返る")},
{id:"paidTools",cat:"あなたの希望",title:"ChatGPT / Claude 有料版を使ってみたいですか？",hint:"現在の付与有無で評価は変わりません。今後の利用希望を教えてください。",nonScore:true,options:[{label:"ぜひ使いたい",value:"strong"},{label:"業務用途が合えば使いたい",value:"interested"},{label:"まず説明・体験会に参加したい",value:"trial"},{label:"今はGeminiで十分",value:"gemini"},{label:"判断できない",value:"unsure"}]},
{id:"department",cat:"最後に",title:"所属部署を教えてください（任意）",hint:"部署別の支援内容を考えるために使用します。",type:"text",placeholder:"例：営業部"}];
const levels=[null,{name:"AIルーキー",lead:"まずはAIに触れる習慣づくりから。小さな定型業務が成長の入口です。",advice:"毎日1回、メールの下書きか文章要約をGeminiに依頼してみましょう。"},{name:"AIチャレンジャー",lead:"基本操作を試し始めた段階。用途を増やせば、手応えが一気に見えてきます。",advice:"目的・背景・出力形式の3点を入れた依頼を、今週3つ試してみましょう。"},{name:"AIパートナー",lead:"AIが日々の頼れる相棒になっています。検証と再利用で、さらに安定します。",advice:"よく使う依頼をテンプレート化し、回答の事実確認ルールもセットにしましょう。"},{name:"AIストラテジスト",lead:"複数業務でAIを戦略的に活用できています。チームへの展開が次のステージです。",advice:"成功例を1つ、入力・出力・注意点を含むミニ手順書にして共有しましょう。"},{name:"AIナビゲーター",lead:"安全性と成果を両立し、周囲の活用も導ける状態です。組織の学びを加速させましょう。",advice:"チームの業務フローを1つ選び、AI活用前後の時間と品質を測って改善しましょう。"}];
$("login").onclick=()=>signInWithPopup(auth,provider).catch(e=>$("gateError").textContent=e.code==="auth/popup-closed-by-user"?"":"ログインできませんでした。もう一度お試しください。");onAuthStateChanged(auth,u=>{user=u;if(u){$("gate").classList.add("hidden");$("game").classList.remove("hidden");render()}});
function render(){const q=questions[index];$("stage").textContent=q.cat;$("counter").textContent=`${String(index+1).padStart(2,"0")} / ${questions.length}`;$("progress").style.width=`${index/questions.length*100}%`;$("qTitle").textContent=q.title;$("qHint").textContent=q.hint;$("answerError").textContent="";$("prev").style.visibility=index?"visible":"hidden";$("next").textContent=index===questions.length-1?"診断結果を見る →":"次へ →";if(q.type==="text"){$("answer").innerHTML=`<input id="textAnswer" class="field" maxlength="50" placeholder="${q.placeholder}" value="${answers[q.id]||""}">`}else{$("answer").innerHTML=`<div class="choices">${q.options.map((o,i)=>`<div class="choice"><input type="radio" id="opt${i}" name="choice" value="${o.value??o.score}" ${String(answers[q.id])===String(o.value??o.score)?"checked":""}><label for="opt${i}"><b>${i+1}</b><span>${o.label}</span></label></div>`).join("")}</div>`}}
$("prev").onclick=()=>{capture(false);index--;render()};$("next").onclick=()=>{if(!capture(true))return;if(index<questions.length-1){index++;render();scrollTo({top:$("game").offsetTop-10,behavior:"smooth"})}else finish()};
function capture(required){const q=questions[index];if(q.type==="text"){answers[q.id]=$("textAnswer").value.trim();return true}const picked=document.querySelector('input[name="choice"]:checked');if(!picked){if(required)$("answerError").textContent="選択肢をひとつ選んでください。";return false}answers[q.id]=q.nonScore?picked.value:Number(picked.value);return true}
async function finish(){const scored=questions.filter(q=>!q.nonScore&&q.type!=="text"),score=scored.reduce((s,q)=>s+(answers[q.id]||0),0),max=scored.length*4,level=score<=12?1:score<=24?2:score<=36?3:score<=47?4:5,info=levels[level];$("game").classList.add("hidden");$("result").classList.remove("hidden");$("level").textContent=level;$("levelName").textContent=info.name;$("levelLead").textContent=info.lead;$("score").textContent=`SCORE ${score} / ${max}`;$("advice").textContent=info.advice;const cats=["習慣","使い方","成果","安全","協働"];$("skills").innerHTML=cats.map(cat=>{const qs=scored.filter(q=>q.cat===cat),v=qs.reduce((s,q)=>s+answers[q.id],0),pct=Math.round(v/(qs.length*4)*100);return `<div class="skill"><span>${cat} <b>${pct}%</b></span><i style="--w:${pct}%"></i></div>`}).join("");scrollTo({top:$("result").offsetTop-20,behavior:"smooth"});try{await setDoc(doc(db,"aiStudy_aiDiagnostics",user.uid),{uid:user.uid,email:user.email||"",name:user.displayName||"",department:answers.department||"",score,level,levelName:info.name,paidToolsInterest:answers.paidTools,answers,version:1,submittedAt:serverTimestamp()});$("saveState").textContent="✓ 診断結果を安全に保存しました"}catch(e){console.error(e);$("saveState").textContent="結果を保存できませんでした。管理者へお問い合わせください。"}}
</script></body></html>
