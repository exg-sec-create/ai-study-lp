<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>参加後アンケート | AI勉強会</title>
<link rel="stylesheet" href="./assets/theme.css">
<style>
/* survey 固有のスタイル。色・文字は assets/theme.css のトークンを使用 */
h1,h2,p{margin:0}
.survey-wrap{max-width:760px}
.progress{height:4px;background:var(--line-strong);border-radius:9px;margin-top:26px;overflow:hidden}
.progress span{display:block;width:0;height:100%;background:var(--grad);transition:width .25s}
.card{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(180deg,rgba(24,31,56,.75),rgba(18,23,43,.6));padding:clamp(20px,5vw,36px);margin-bottom:16px}
.gate{text-align:center;padding:44px 22px;background:linear-gradient(140deg,var(--violet-soft),var(--teal-soft) 60%,transparent),var(--surface)}
.gate h2,.done h2{font-family:var(--font-serif);font-weight:800;font-size:22px;letter-spacing:.03em;margin-bottom:8px}
.gate p,.done p{color:var(--muted);font-size:14px;margin-bottom:22px}
.gate .ai-btn{padding:13px 28px}
.question{margin-bottom:30px}
.question:last-child{margin-bottom:0}
.question legend,.question>label{display:block;font-weight:700;font-size:15px;margin-bottom:12px;padding:0}
.req{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--teal-soft);color:var(--teal);margin-left:8px;vertical-align:2px}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.scale input{position:absolute;opacity:0;pointer-events:none}
.scale label{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:56px;padding:9px 4px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:rgba(11,14,26,.5);color:var(--muted);cursor:pointer;transition:border-color .2s,background .2s,color .2s;line-height:1.3}
.scale label:hover{border-color:var(--violet);color:var(--text)}
.scale label b{font:700 19px var(--font-latin)}
.scale label span{font-size:12px;min-height:12px}
.scale input:focus-visible+label{outline:2px solid var(--teal);outline-offset:2px}
.scale input:checked+label{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.ends{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;margin-top:8px}
.ends span:last-child{text-align:right}
select,textarea{width:100%;background:rgba(11,14,26,.6);color:var(--text);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:12px 14px;font:inherit;font-size:14px;transition:border-color .2s,box-shadow .2s}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
textarea{min-height:110px;resize:vertical}
select:focus,textarea:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-soft)}
textarea::placeholder{color:var(--faint)}
.userline{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:13px;margin-bottom:16px}
.userline b{color:var(--text)}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:13px;padding:4px 0}
.linkbtn:hover{color:var(--text)}
.submit{width:100%;padding:15px 22px;font-size:16px}
.error{color:#ffb3bb;font-size:13px;margin:12px 0 0}
.error:empty{display:none}
.done{text-align:center;padding:50px 22px}
.done .mark{width:60px;height:60px;margin:0 auto 16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:var(--teal);background:var(--teal-soft);border:1px solid rgba(70,227,200,.4)}
.hidden{display:none!important}
@media(max-width:520px){.scale{gap:5px}.scale label{padding:8px 2px;min-height:52px}}
</style></head>
<body>
<div id="ai-nav" data-page="survey"></div>
<script src="./assets/nav.js"></script>
<main class="ai-main"><div class="ai-wrap survey-wrap">
<div class="ai-hero"><div class="ai-eyebrow">Post-event survey</div><h1 class="ai-title">参加後<span class="grad">アンケート</span></h1><p class="ai-lead" id="eventLabel">AI勉強会へのご参加ありがとうございました。今後の企画づくりに、率直なご意見をお聞かせください。</p><div class="progress"><span id="progress"></span></div></div>
<section class="card gate" id="gate"><h2>回答をはじめる</h2><p>社内Googleアカウントでログインしてください。<br>回答内容は勉強会の運営メンバーのみ確認できます。</p><button class="ai-btn white" id="login">Googleでログイン</button><div class="error" id="gateError"></div></section>
<form id="surveyForm" class="hidden">
<div class="userline"><span><b id="userName"></b> さんとして回答中</span><button type="button" class="linkbtn" id="logout">別のアカウント</button></div>
<section class="card" id="scaleCard"></section>
<section class="card" id="otherCard"></section>
<button class="ai-btn primary submit" id="submit" type="submit">回答を送信する</button><div class="error" id="formError" role="alert"></div></form>
<section class="card done hidden" id="done"><div class="mark" aria-hidden="true">✓</div><h2>ご回答ありがとうございました</h2><p>いただいた声を、次回のAI勉強会づくりに活かします。</p><a class="ai-btn teal" href="./index.html">勉強会ページへ戻る</a></section>
</div></main>
<footer class="ai-footer"><div class="ai-wrap"><div>© 2026 AI Study — Internal use only</div><div class="latin">Powered by Firebase</div></div></footer>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";import{getFirestore,doc,getDoc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";import{firebaseConfig}from"./firebase-config.js";import{normalizeSurveyQuestions}from"./survey-questions.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider(),$=id=>document.getElementById(id);let user,eventDate="",questions=normalizeSurveyQuestions(null);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function scaleFieldHtml(q){const opts=[1,2,3,4,5].map(v=>`<input id="${q.id}${v}" type="radio" name="${q.id}" value="${v}" ${q.required?"required":""}><label for="${q.id}${v}"><b>${v}</b><span>${v===5?"★":""}</span></label>`).join("");return `<fieldset class="question" style="border:0;padding:0"><legend>${esc(q.label)}${q.required?'<span class="req">必須</span>':""}</legend><div class="scale">${opts}</div><div class="ends"><span>${esc(q.lowLabel||"")}</span><span>${esc(q.highLabel||"")}</span></div></fieldset>`}
function otherFieldHtml(q){if(q.type==="choice"){const opts=['<option value="">選択してください</option>',...q.options.map(o=>`<option>${esc(o)}</option>`)].join("");return `<div class="question"><label for="${q.id}">${esc(q.label)}${q.required?'<span class="req">必須</span>':""}</label><select id="${q.id}" ${q.required?"required":""}>${opts}</select></div>`}return `<div class="question"><label for="${q.id}">${esc(q.label)}${q.required?'<span class="req">必須</span>':""}</label><textarea id="${q.id}" maxlength="1000" placeholder="${esc(q.placeholder||"")}" ${q.required?"required":""}></textarea></div>`}
function renderQuestions(){const scaleQs=questions.filter(q=>q.type==="scale"),otherQs=questions.filter(q=>q.type!=="scale");$("scaleCard").innerHTML=scaleQs.map(scaleFieldHtml).join("");$("scaleCard").style.display=scaleQs.length?"":"none";$("otherCard").innerHTML=otherQs.map(otherFieldHtml).join("");$("otherCard").style.display=otherQs.length?"":"none"}
function answered(q){if(q.type==="scale")return !!document.querySelector(`[name="${q.id}"]:checked`);if(q.type==="choice")return !!$(q.id)?.value;return !!$(q.id)?.value.trim()}
function updateProgress(){const required=questions.filter(q=>q.required);const done=required.filter(answered).length;$("progress").style.width=`${(done/(required.length||1))*100}%`}
async function loadEvent(){try{const s=await getDoc(doc(db,"aiStudy_settings","event")),d=s.data()||{};eventDate=typeof d.startAt==="string"?d.startAt.slice(0,10):"event";if(d.dateLabel)$("eventLabel").textContent=`${d.dateLabel} 開催のAI勉強会について、率直なご意見をお聞かせください。`;questions=normalizeSurveyQuestions(d.surveyQuestions);}catch(e){console.error(e)}renderQuestions()}loadEvent();
$("login").onclick=()=>signInWithPopup(auth,provider).catch(e=>$("gateError").textContent=e.code==="auth/popup-closed-by-user"?"":"ログインに失敗しました。");$("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{user=u;$("gate").classList.toggle("hidden",!!u);$("surveyForm").classList.toggle("hidden",!u);$("done").classList.add("hidden");if(u)$("userName").textContent=u.displayName||u.email});
$("scaleCard").addEventListener("change",updateProgress);$("otherCard").addEventListener("change",updateProgress);$("otherCard").addEventListener("input",updateProgress);
$("surveyForm").onsubmit=async e=>{e.preventDefault();if(!user)return;const missing=questions.filter(q=>q.required).find(q=>!answered(q));if(missing){$("formError").textContent="必須項目をすべて回答してください。";return}$("submit").disabled=true;$("formError").textContent="";const answers={};questions.forEach(q=>{if(q.type==="scale")answers[q.id]=Number(document.querySelector(`[name="${q.id}"]:checked`)?.value||0);else if(q.type==="choice")answers[q.id]=$(q.id)?.value||"";else answers[q.id]=($(q.id)?.value||"").trim()});try{await setDoc(doc(db,"aiStudy_surveys",`${eventDate}__${user.uid}`),{uid:user.uid,email:user.email||"",name:user.displayName||"",eventDate,...answers,submittedAt:serverTimestamp()});$("surveyForm").classList.add("hidden");$("done").classList.remove("hidden");$("progress").style.width="100%";window.scrollTo({top:0,behavior:"smooth"})}catch(err){console.error(err);$("formError").textContent=err.code==="permission-denied"?"このアカウントには回答権がありません。運営メンバーへお問い合わせください。":"送信できませんでした。時間をおいて再度お試しください。"}finally{$("submit").disabled=false}};
</script></body></html>
