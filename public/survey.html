<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>参加後アンケート | AI勉強会</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0e1a;--card:#12172b;--field:#0e1324;--line:rgba(235,239,255,.11);--text:#eceff8;--muted:#98a0bc;--violet:#8b7cff;--teal:#46e3c8;--danger:#ff8390}*{box-sizing:border-box}body{margin:0;background:radial-gradient(700px 420px at 90% 0,rgba(139,124,255,.18),transparent 65%),var(--bg);color:var(--text);font-family:"Zen Kaku Gothic New",sans-serif;line-height:1.7}.wrap{width:min(760px,calc(100% - 40px));margin:auto;padding-bottom:70px}header{height:76px;display:flex;justify-content:space-between;align-items:center}.brand{font:700 14px "Space Grotesk";letter-spacing:.05em}.brand:before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;background:linear-gradient(135deg,var(--violet),var(--teal));margin-right:10px}.back{color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:12px}.hero{padding:44px 0 35px}.eyebrow{color:var(--teal);font:700 12px "Space Grotesk";letter-spacing:.24em;text-transform:uppercase}.hero h1{font:800 clamp(31px,7vw,50px)/1.35 "Shippori Mincho B1";margin:13px 0}.hero p{color:var(--muted);margin:0}.progress{height:4px;background:var(--line);border-radius:9px;margin-top:29px;overflow:hidden}.progress span{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--violet),var(--teal));transition:width .25s}.card{background:rgba(18,23,43,.94);border:1px solid var(--line);border-radius:20px;padding:clamp(22px,5vw,38px);margin-bottom:18px}.gate{text-align:center;padding:48px 24px}.gate h2{margin:0 0 8px}.gate p{color:var(--muted);font-size:14px}.google,.submit{border:0;border-radius:99px;padding:14px 27px;font:700 14px inherit;cursor:pointer}.google{background:#fff;color:#181b25}.question{margin-bottom:32px}.question:last-child{margin-bottom:0}.question legend,.question>label{display:block;font-weight:700;margin-bottom:12px}.req{color:var(--teal);font-size:11px;margin-left:8px}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.scale input{position:absolute;opacity:0}.scale label{display:flex;flex-direction:column;align-items:center;padding:11px 4px;border:1px solid var(--line);border-radius:12px;color:var(--muted);cursor:pointer;transition:.2s}.scale label b{font:700 19px "Space Grotesk"}.scale input:checked+label{border-color:var(--teal);background:rgba(70,227,200,.1);color:var(--teal)}.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:7px}select,textarea{width:100%;background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:13px;font:14px inherit}textarea{min-height:105px;resize:vertical}select:focus,textarea:focus{outline:2px solid rgba(70,227,200,.4);border-color:var(--teal)}.userline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;margin-bottom:18px}.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer}.submit{width:100%;background:linear-gradient(110deg,var(--violet),var(--teal));color:#0b0e1a;font-size:16px}.submit:disabled{opacity:.5}.error{color:var(--danger);font-size:13px;margin:12px 0 0}.done{text-align:center;padding:55px 25px}.done .mark{font-size:45px}.done a{display:inline-block;color:#071712;background:var(--teal);border-radius:99px;padding:11px 22px;text-decoration:none;font-weight:700}.hidden{display:none!important}@media(max-width:520px){.scale{gap:4px}.scale label{padding:9px 2px}.hero{padding-top:27px}}
</style></head>
<body><div class="wrap"><header><div class="brand">AI STUDY / FEEDBACK</div><a class="back" href="./index.html">勉強会ページへ戻る</a></header>
<main><div class="hero"><div class="eyebrow">Post-event survey</div><h1>参加後アンケート</h1><p id="eventLabel">AI勉強会へのご参加ありがとうございました。今後の企画づくりに、率直なご意見をお聞かせください。</p><div class="progress"><span id="progress"></span></div></div>
<section class="card gate" id="gate"><h2>回答をはじめる</h2><p>社内Googleアカウントでログインしてください。<br>回答内容は勉強会の運営メンバーのみ確認できます。</p><button class="google" id="login">Googleでログイン</button><div class="error" id="gateError"></div></section>
<form id="surveyForm" class="hidden">
<div class="userline"><span><b id="userName"></b> さんとして回答中</span><button type="button" class="linkbtn" id="logout">別のアカウント</button></div>
<section class="card" id="scaleCard"></section>
<section class="card" id="otherCard"></section>
<button class="submit" id="submit" type="submit">回答を送信する</button><div class="error" id="formError" role="alert"></div></form>
<section class="card done hidden" id="done"><div class="mark">✓</div><h2>ご回答ありがとうございました</h2><p>いただいた声を、次回のAI勉強会づくりに活かします。</p><a href="./index.html">勉強会ページへ戻る</a></section>
</main></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";import{getFirestore,doc,getDoc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";import{firebaseConfig}from"./firebase-config.js";import{normalizeSurveyQuestions}from"./survey-questions.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider(),$=id=>document.getElementById(id);let user,eventDate="",questions=normalizeSurveyQuestions(null);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function scaleFieldHtml(q){const opts=[1,2,3,4,5].map(v=>`<input id="${q.id}${v}" type="radio" name="${q.id}" value="${v}" ${q.required?"required":""}><label for="${q.id}${v}"><b>${v}</b><span>${v===5?"★":""}</span></label>`).join("");return `<fieldset class="question" style="border:0;padding:0"><legend>${esc(q.label)}${q.required?'<span class="req">必須</span>':""}</legend><div class="scale">${opts}</div><div class="ends"><span>${esc(q.lowLabel||"")}</span><span>${esc(q.highLabel||"")}</span></div></fieldset>`}
function otherFieldHtml(q){if(q.type==="choice"){const opts=['<option value="">選択してください</option>',...q.options.map(o=>`<option>${esc(o)}</option>`)].join("");return `<div class="question"><label for="${q.id}">${esc(q.label)}${q.required?'<span class="req">必須</span>':""}</label><select id="${q.id}" ${q.required?"required":""}>${opts}</select></div>`}return `<div class="question"><label for="${q.id}">${esc(q.label)}${q.required?'<span class="req">必須</span>':""}</label><textarea id="${q.id}" maxlength="1000" placeholder="${esc(q.placeholder||"")}" ${q.required?"required":""}></textarea></div>`}
function renderQuestions(){const scaleQs=questions.filter(q=>q.type==="scale"),otherQs=questions.filter(q=>q.type!=="scale");$("scaleCard").innerHTML=scaleQs.map(scaleFieldHtml).join("");$("scaleCard").style.display=scaleQs.length?"":"none";$("otherCard").innerHTML=otherQs.map(otherFieldHtml).join("");$("otherCard").style.display=otherQs.length?"":"none"}
function answered(q){if(q.type==="scale")return !!document.querySelector(`[name="${q.id}"]:checked`);if(q.type==="choice")return !!$(q.id)?.value;return !!$(q.id)?.value.trim()}
function updateProgress(){const required=questions.filter(q=>q.required);const done=required.filter(answered).length;$("progress").style.width=`${(done/(required.length||1))*100}%`}
async function loadEvent(){try{const s=await getDoc(doc(db,"aiStudy_settings","event")),d=s.data()||{};eventDate=typeof d.startAt==="string"?d.startAt.slice(0,10):"event";if(d.dateLabel)$("eventLabel").textContent=`${d.dateLabel} 開催のAI勉強会について、率直なご意見をお聞かせください。`;questions=normalizeSurveyQuestions(d.surveyQuestions);}catch(e){console.error(e)}renderQuestions()}loadEvent();
$("login").onclick=()=>signInWithPopup(auth,provider).catch(e=>$("gateError").textContent=e.code==="auth/popup-closed-by-user"?"":"ログインに失敗しました。");$("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{user=u;$("gate").classList.toggle("hidden",!!u);$("surveyForm").classList.toggle("hidden",!u);$("done").classList.add("hidden");if(u)$("userName").textContent=u.displayName||u.email});
$("scaleCard").addEventListener("change",updateProgress);$("otherCard").addEventListener("change",updateProgress);$("otherCard").addEventListener("input",updateProgress);
$("surveyForm").onsubmit=async e=>{e.preventDefault();if(!user)return;const missing=questions.filter(q=>q.required).find(q=>!answered(q));if(missing){$("formError").textContent="必須項目をすべて回答してください。";return}$("submit").disabled=true;$("formError").textContent="";const answers={};questions.forEach(q=>{if(q.type==="scale")answers[q.id]=Number(document.querySelector(`[name="${q.id}"]:checked`)?.value||0);else if(q.type==="choice")answers[q.id]=$(q.id)?.value||"";else answers[q.id]=($(q.id)?.value||"").trim()});try{await setDoc(doc(db,"aiStudy_surveys",`${eventDate}__${user.uid}`),{uid:user.uid,email:user.email||"",name:user.displayName||"",eventDate,...answers,submittedAt:serverTimestamp()});$("surveyForm").classList.add("hidden");$("done").classList.remove("hidden");$("progress").style.width="100%";window.scrollTo({top:0,behavior:"smooth"})}catch(err){console.error(err);$("formError").textContent=err.code==="permission-denied"?"このアカウントには回答権がありません。運営メンバーへお問い合わせください。":"送信できませんでした。時間をおいて再度お試しください。"}finally{$("submit").disabled=false}};
</script></body></html>
