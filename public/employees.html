<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>社員マスタ管理 | AI STUDY</title>
<link rel="stylesheet" href="./assets/theme.css">
<style>
  .hidden { display:none !important; }
  textarea.ai-input { min-height:220px; font-family:ui-monospace,Menlo,monospace; font-size:12px; }
  .msg { margin-top:10px; font-size:13px; } .ok { color:var(--teal); } .err { color:var(--coral); }
  code { font-family:ui-monospace,Menlo,monospace; font-size:12px; background:rgba(255,255,255,.06); padding:1px 6px; border-radius:6px; }
  .acts { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
</style>
</head>
<body>
<div id="ai-nav" data-page="employees"></div>
<script src="./assets/nav.js"></script>
<main class="ai-main"><div class="ai-wrap">
  <section class="ai-hero">
    <div class="ai-eyebrow">Employee Master</div>
    <h1 class="ai-title">社員<span class="grad">マスタ</span></h1>
    <p class="ai-lead">事例投稿フォームで氏名・部門を自動判定するための社員マスタ（Firestore <code>aiStudy_employees</code>）を登録します。個人情報をコードに書かずに済むよう、データはここからFirestoreにだけ保存します。管理者のみ利用できます。</p>
  </section>

  <div id="gate" class="ai-card ai-gate">
    <h2>管理者ログイン</h2>
    <button class="ai-btn white" id="login" type="button">Googleでログイン</button>
    <div class="msg err" id="gate-msg"></div>
  </div>

  <div id="app" class="hidden">
    <div class="ai-card">
      <h3>CSVを貼り付けて登録</h3>
      <p style="color:var(--muted);font-size:13px;margin:0 0 10px">1行目は見出し <code>email,name,dept,role</code>。同じメールの人は上書きされます。</p>
      <textarea class="ai-input" id="csv" placeholder="email,name,dept,role&#10;taro@example.com,山田 太郎,営業,"></textarea>
      <div class="acts"><button class="ai-btn" id="preview" type="button">確認する</button>
      <button class="ai-btn primary hidden" id="save" type="button">この内容で登録する</button></div>
      <div id="preview-box" style="margin-top:12px"></div>
      <div class="msg" id="msg"></div>
    </div>
    <div class="ai-card">
      <h3>登録済み <span id="count"></span></h3>
      <button class="ai-btn sm" id="load" type="button">一覧を表示</button>
      <div id="list" style="margin-top:12px"></div>
    </div>
  </div>
</div></main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, collection, writeBatch } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let rows = [];

$('login').onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => { $('gate-msg').textContent = e.message; });
onAuthStateChanged(auth, async u => {
  if(!u) return;
  try { const a = await getDoc(doc(db, 'aiStudy_settings', 'access')); if(!a.exists()) throw 0; }
  catch(e){ $('gate-msg').textContent = 'このアカウントは管理者ではありません。'; return; }
  $('gate').classList.add('hidden'); $('app').classList.remove('hidden');
});

function parseCsv(text){
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if(lines[0] && /^email\s*,/i.test(lines[0])) lines.shift();
  return lines.map(l => { const [email='', name='', dept='', role=''] = l.split(',').map(s => s.trim()); return { email: email.toLowerCase(), name, dept, role }; })
    .filter(r => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(r.email) && r.name);
}
$('preview').onclick = () => {
  rows = parseCsv($('csv').value);
  $('preview-box').innerHTML = rows.length ? `<div class="ai-table-wrap"><table class="ai-table"><tr><th>email</th><th>氏名</th><th>部門</th><th>役職</th></tr>${rows.map(r=>`<tr><td>${esc(r.email)}</td><td>${esc(r.name)}</td><td>${esc(r.dept)}</td><td>${esc(r.role)}</td></tr>`).join('')}</table></div>` : '<p class="err">登録できる行がありません。</p>';
  $('save').classList.toggle('hidden', !rows.length);
  $('msg').textContent = rows.length ? `${rows.length}件を登録します。内容を確認してください。` : '';
};
$('save').onclick = async () => {
  $('save').disabled = true;
  try {
    for(let i = 0; i < rows.length; i += 400){
      const b = writeBatch(db);
      rows.slice(i, i + 400).forEach(r => b.set(doc(db, 'aiStudy_employees', r.email), { name:r.name, dept:r.dept, role:r.role }));
      await b.commit();
    }
    $('msg').className = 'msg ok'; $('msg').textContent = `${rows.length}件を登録しました。`;
    $('csv').value = ''; $('preview-box').innerHTML = ''; $('save').classList.add('hidden');
  } catch(e){ $('msg').className = 'msg err'; $('msg').textContent = '登録に失敗しました：' + (e.code || e.message); }
  finally { $('save').disabled = false; }
};
$('load').onclick = async () => {
  const snap = await getDocs(collection(db, 'aiStudy_employees'));
  $('count').textContent = `（${snap.size}件）`;
  $('list').innerHTML = `<div class="ai-table-wrap"><table class="ai-table"><tr><th>email</th><th>氏名</th><th>部門</th><th>役職</th></tr>${snap.docs.map(d=>{ const x = d.data(); return `<tr><td>${esc(d.id)}</td><td>${esc(x.name)}</td><td>${esc(x.dept)}</td><td>${esc(x.role)}</td></tr>`; }).join('')}</table></div>`;
};
</script>
</body>
</html>
