<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>社員マスタ管理 | EXCEED GROUP</title>
<style>
  :root { --ink:#0E1330; --violet:#6C5CE7; --teal:#1FB6A6; --coral:#E8654F; --paper:#F7F8FC; --card:#fff; --line:rgba(20,28,70,.12); --t1:#12173A; --t2:#5A6288; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper:#0B0E1A; --card:#141A30; --line:rgba(235,239,255,.12); --t1:#ECEFF8; --t2:#A4ABC8; } }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif; background:var(--paper); color:var(--t1); font-size:14px; line-height:1.7; }
  .wrap { max-width:860px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:22px; } p { color:var(--t2); font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-top:16px; }
  textarea { width:100%; min-height:220px; border:1px solid var(--line); border-radius:10px; padding:10px; font-family:ui-monospace,monospace; font-size:12px; background:var(--card); color:var(--t1); }
  .btn { border:1px solid var(--line); background:var(--card); color:var(--t1); border-radius:999px; padding:9px 18px; font-weight:700; cursor:pointer; margin-top:10px; }
  .btn.primary { background:var(--violet); border-color:var(--violet); color:#fff; }
  .msg { margin-top:10px; font-size:13px; } .ok { color:var(--teal); } .err { color:var(--coral); }
  table { width:100%; border-collapse:collapse; font-size:12px; margin-top:10px; } td, th { border-bottom:1px solid var(--line); padding:6px; text-align:left; }
  .hidden { display:none; } a { color:var(--violet); }
</style>
</head>
<body>
<div class="wrap">
  <a href="./admin.html">← 管理者ページ</a>
  <h1 style="margin-top:10px">社員マスタ管理</h1>
  <p>事例投稿フォームで氏名・部門を自動判定するための社員マスタ（Firestore <code>aiStudy_employees</code>）を登録します。個人情報をコードに書かずに済むよう、データはここからFirestoreにだけ保存します。管理者（admins）のみ利用できます。</p>

  <div id="gate" class="card">
    <button class="btn primary" id="login">Googleでログイン</button>
    <div class="msg err" id="gate-msg"></div>
  </div>

  <div id="app" class="hidden">
    <div class="card">
      <h3>CSVを貼り付けて登録</h3>
      <p>1行目は見出し <code>email,name,dept,role</code>。同じメールの人は上書きされます。</p>
      <textarea id="csv" placeholder="email,name,dept,role&#10;taro@example.com,山田 太郎,営業,"></textarea>
      <button class="btn" id="preview">確認する</button>
      <div id="preview-box"></div>
      <button class="btn primary hidden" id="save">この内容で登録する</button>
      <div class="msg" id="msg"></div>
    </div>
    <div class="card">
      <h3>登録済み <span id="count"></span></h3>
      <button class="btn" id="load">一覧を表示</button>
      <div id="list"></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, collection, writeBatch } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let rows = [];

$('login').onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => { $('gate-msg').textContent = e.message; });
onAuthStateChanged(auth, async u => {
  if(!u) return;
  try { const a = await getDoc(doc(db, 'aiStudy_settings', 'access')); if(!a.exists()) throw 0; }
  catch(e){ $('gate-msg').textContent = 'このアカウントは管理者ではありません。'; return; }
  $('gate').classList.add('hidden'); $('app').classList.remove('hidden');
});

function parseCsv(text){
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if(lines[0] && /^email\s*,/i.test(lines[0])) lines.shift();
  return lines.map(l => { const [email='', name='', dept='', role=''] = l.split(',').map(s => s.trim()); return { email: email.toLowerCase(), name, dept, role }; })
    .filter(r => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(r.email) && r.name);
}
$('preview').onclick = () => {
  rows = parseCsv($('csv').value);
  $('preview-box').innerHTML = rows.length ? `<table><tr><th>email</th><th>氏名</th><th>部門</th><th>役職</th></tr>${rows.map(r=>`<tr><td>${esc(r.email)}</td><td>${esc(r.name)}</td><td>${esc(r.dept)}</td><td>${esc(r.role)}</td></tr>`).join('')}</table>` : '<p class="err">登録できる行がありません。</p>';
  $('save').classList.toggle('hidden', !rows.length);
  $('msg').textContent = rows.length ? `${rows.length}件を登録します。内容を確認してください。` : '';
};
$('save').onclick = async () => {
  $('save').disabled = true;
  try {
    for(let i = 0; i < rows.length; i += 400){
      const b = writeBatch(db);
      rows.slice(i, i + 400).forEach(r => b.set(doc(db, 'aiStudy_employees', r.email), { name:r.name, dept:r.dept, role:r.role }));
      await b.commit();
    }
    $('msg').className = 'msg ok'; $('msg').textContent = `${rows.length}件を登録しました。`;
    $('csv').value = ''; $('preview-box').innerHTML = ''; $('save').classList.add('hidden');
  } catch(e){ $('msg').className = 'msg err'; $('msg').textContent = '登録に失敗しました：' + (e.code || e.message); }
  finally { $('save').disabled = false; }
};
$('load').onclick = async () => {
  const snap = await getDocs(collection(db, 'aiStudy_employees'));
  $('count').textContent = `（${snap.size}件）`;
  $('list').innerHTML = `<table><tr><th>email</th><th>氏名</th><th>部門</th><th>役職</th></tr>${snap.docs.map(d=>{ const x = d.data(); return `<tr><td>${esc(d.id)}</td><td>${esc(x.name)}</td><td>${esc(x.dept)}</td><td>${esc(x.role)}</td></tr>`; }).join('')}</table>`;
};
</script>
</body>
</html>
