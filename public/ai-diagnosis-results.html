<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI QUEST｜診断集計</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600;800&family=Noto+Sans+JP:wght@400;600;800&display=swap" rel="stylesheet"><style>
:root{--ink:#14212b;--muted:#69757e;--paper:#f4f2eb;--card:#fff;--lime:#c9ff53;--purple:#7358ff;--line:#dfe2dc}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans JP",sans-serif}.wrap{width:min(1120px,calc(100% - 32px));margin:auto;padding:28px 0 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:55px}.logo{font:800 16px "DM Sans"}.logo:before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--lime);border:2px solid var(--ink);margin-right:8px}.tag{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:7px 12px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:28px}.hero h1{font-size:clamp(35px,7vw,66px);letter-spacing:-.05em;margin:0}.hero p{color:var(--muted);margin:8px 0}.btn{border:2px solid var(--ink);border-radius:10px;background:var(--lime);box-shadow:3px 3px 0 var(--ink);padding:11px 16px;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px}.metric b{font:800 38px "DM Sans";display:block}.metric span{font-size:12px;color:var(--muted)}.wide{grid-column:span 2}.section{margin-top:14px}.section h2{font-size:17px;margin-top:0}.levels{display:flex;align-items:end;gap:9px;height:180px;padding-top:20px}.level{flex:1;text-align:center}.level i{display:block;background:var(--purple);height:var(--h);min-height:3px;border-radius:7px 7px 0 0}.level b{font:700 12px "DM Sans"}.level small{display:block;color:var(--muted)}.interest{display:grid;gap:12px}.interest-row{display:grid;grid-template-columns:150px 1fr 30px;gap:8px;align-items:center;font-size:12px}.track{height:9px;background:#eee;border-radius:9px;overflow:hidden}.track i{display:block;height:100%;background:var(--lime);width:var(--w)}.tablecard{margin-top:14px;overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line)}th{font-size:10px;letter-spacing:.1em;color:var(--muted)}.lv{font:800 12px "DM Sans";background:#eeeaff;color:var(--purple);padding:5px 9px;border-radius:99px}.gate{text-align:center;max-width:580px;margin:15vh auto;background:#fff;border:2px solid var(--ink);border-radius:20px;padding:45px;box-shadow:6px 6px 0 var(--ink)}.gate p,.state{color:var(--muted)}.hidden{display:none!important}@media(max-width:750px){.grid{grid-template-columns:repeat(2,1fr)}.wide{grid-column:span 2}.hero{align-items:flex-start;flex-direction:column}.interest-row{grid-template-columns:110px 1fr 25px}}@media(max-width:430px){.grid{grid-template-columns:1fr}.wide{grid-column:span 1}}
</style></head><body><div class="wrap"><header class="top"><div class="logo">AI QUEST / INSIGHTS</div><span class="tag">ADMIN ONLY</span></header><section id="gate" class="gate"><h1>集計ページ</h1><p>診断結果は管理者のみ閲覧できます。社内Googleアカウントでログインしてください。</p><button id="login" class="btn">Googleでログイン</button><p id="error"></p></section><main id="dashboard" class="hidden"><div class="hero"><div><h1>AI活用レポート</h1><p id="updated">最新回答を集計しています</p></div><button id="csv" class="btn">CSVダウンロード ↓</button></div><div class="grid"><div class="card metric"><b id="total">0</b><span>回答者数</span></div><div class="card metric"><b id="average">—</b><span>平均レベル</span></div><div class="card metric"><b id="daily">—</b><span>1日3回以上の利用者</span></div><div class="card metric"><b id="want">—</b><span>有料AIに関心あり</span></div><div class="card wide section"><h2>レベル分布</h2><div id="levels" class="levels"></div></div><div class="card wide section"><h2>ChatGPT / Claude 利用希望</h2><div id="interest" class="interest"></div></div></div><div class="card tablecard"><h2>回答一覧</h2><table><thead><tr><th>氏名</th><th>部署</th><th>レベル</th><th>スコア</th><th>利用頻度</th><th>有料AI希望</th><th>回答日時</th></tr></thead><tbody id="rows"></tbody></table><p id="empty" class="state"></p></div></main></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";import{getFirestore,doc,getDoc,collection,getDocs}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";import{firebaseConfig}from"./firebase-config.js";const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider(),$=id=>document.getElementById(id);let data=[];const interestLabels={strong:"ぜひ使いたい",interested:"用途が合えば",trial:"説明・体験希望",gemini:"Geminiで十分",unsure:"判断できない"},freq=["使わない","週に数回","1〜2回/日","3〜5回/日","6回以上/日"];
$("login").onclick=()=>signInWithPopup(auth,provider).catch(()=>$("error").textContent="ログインできませんでした。");onAuthStateChanged(auth,async user=>{if(!user)return;try{await getDoc(doc(db,"aiStudy_settings","access"));$("gate").classList.add("hidden");$("dashboard").classList.remove("hidden");data=(await getDocs(collection(db,"aiStudy_aiDiagnostics"))).docs.map(d=>d.data());render()}catch(e){console.error(e);$("error").textContent="このアカウントには集計結果の閲覧権限がありません。"}});
function render(){const n=data.length,avg=n?data.reduce((s,d)=>s+d.level,0)/n:0,daily=n?data.filter(d=>(d.answers?.frequency||0)>=3).length/n*100:0,interested=n?data.filter(d=>["strong","interested","trial"].includes(d.paidToolsInterest)).length/n*100:0;$("total").textContent=n;$("average").textContent=n?avg.toFixed(1):"—";$("daily").textContent=n?`${Math.round(daily)}%`:"—";$("want").textContent=n?`${Math.round(interested)}%`:"—";$("updated").textContent=`${new Date().toLocaleString("ja-JP")} 時点 · 最新回答`;const counts=[1,2,3,4,5].map(l=>data.filter(d=>d.level===l).length),max=Math.max(...counts,1);$("levels").innerHTML=counts.map((c,i)=>`<div class="level"><i style="--h:${c/max*120}px"></i><b>LV.${i+1}</b><small>${c}人</small></div>`).join("");const keys=["strong","interested","trial","gemini","unsure"];$("interest").innerHTML=keys.map(k=>{const c=data.filter(d=>d.paidToolsInterest===k).length;return `<div class="interest-row"><span>${interestLabels[k]}</span><div class="track"><i style="--w:${n?c/n*100:0}%"></i></div><b>${c}</b></div>`}).join("");$("rows").innerHTML=data.sort((a,b)=>(b.submittedAt?.seconds||0)-(a.submittedAt?.seconds||0)).map(d=>`<tr><td>${esc(d.name||d.email)}</td><td>${esc(d.department||"—")}</td><td><span class="lv">LV.${d.level} ${esc(d.levelName||"")}</span></td><td>${d.score}/56</td><td>${freq[d.answers?.frequency||0]}</td><td>${interestLabels[d.paidToolsInterest]||"—"}</td><td>${d.submittedAt?.toDate?.().toLocaleDateString("ja-JP")||"—"}</td></tr>`).join("");$("empty").textContent=n?"":"まだ回答がありません。"}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));$("csv").onclick=()=>{const cols=["氏名","メール","部署","レベル","レベル名","スコア","利用頻度","有料AI希望","回答日時"],rows=data.map(d=>[d.name,d.email,d.department,d.level,d.levelName,d.score,freq[d.answers?.frequency||0],interestLabels[d.paidToolsInterest],d.submittedAt?.toDate?.().toISOString()||""]);const csv="\ufeff"+[cols,...rows].map(r=>r.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`ai-diagnosis-${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(a.href)};
</script></body></html>
