<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI QUEST｜診断集計</title>
<link rel="stylesheet" href="./assets/theme.css">
<style>
button{font:inherit}
.gate{text-align:center;max-width:580px;margin:40px auto 0}
.gate h1{font-family:var(--font-serif);font-weight:800;font-size:clamp(24px,4vw,32px);margin:0 0 10px}
.gate p,.state{color:var(--muted)}
#error{color:var(--coral);margin:14px 0 0}
.hero-row{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;flex-wrap:wrap}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;background:linear-gradient(120deg,var(--violet),#a99bff);color:#fff;box-shadow:0 8px 26px rgba(139,124,255,.28);border-radius:999px;padding:11px 22px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.grid .ai-card+.ai-card{margin-top:0}
.grid .ai-card{padding:20px;min-width:0}
.metric b{font:700 36px/1.2 var(--font-latin);display:block}
.metric span{font-size:12px;color:var(--muted);letter-spacing:.06em}
.metric.accent b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.wide{grid-column:span 2}
.section h2,.tablecard h2{font-family:var(--font-serif);font-weight:800;font-size:18px;margin:0 0 6px}
.levels{display:flex;align-items:flex-end;gap:9px;height:180px;padding-top:20px}
.level{flex:1;text-align:center;min-width:0}
.level i{display:block;background:var(--grad);height:var(--h);min-height:3px;border-radius:7px 7px 0 0;opacity:.9}
.level b{font:700 12px var(--font-latin);display:block;margin-top:6px}
.level small{display:block;color:var(--muted);font-size:11px}
.interest{display:grid;gap:12px;margin-top:12px}
.interest-row{display:grid;grid-template-columns:150px minmax(0,1fr) 30px;gap:8px;align-items:center;font-size:13px}
.interest-row b{font-family:var(--font-latin);text-align:right}
.track{height:9px;background:rgba(255,255,255,.07);border-radius:9px;overflow:hidden}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#8bffd9);width:var(--w)}
.tablecard{margin-top:14px}
.tablecard .ai-table-wrap{margin-top:12px}
.tablecard table{white-space:nowrap}
.lv{font:700 12px var(--font-latin);background:var(--violet-soft);color:var(--violet);padding:4px 10px;border-radius:99px}
.detailbtn{border:1px solid var(--line-strong);background:transparent;color:var(--text);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:700;font-size:12px}
.detailbtn:hover{border-color:var(--violet)}
.growth{font-weight:700}
.growth.up{color:var(--teal)}
.growth.down{color:var(--coral)}
.answer-detail td{background:rgba(255,255,255,.02);white-space:normal}
.answer-grid{display:grid;grid-template-columns:repeat(2,minmax(240px,1fr));gap:10px;padding:8px}
.answer-item{border:1px solid var(--line);background:rgba(11,14,26,.4);border-radius:10px;padding:10px 12px;font-size:13px}
.answer-item b{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.hidden{display:none!important}
@media(max-width:750px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wide{grid-column:span 2}.interest-row{grid-template-columns:110px minmax(0,1fr) 25px}}
@media(max-width:430px){.grid{grid-template-columns:1fr}.wide{grid-column:span 1}.answer-grid{grid-template-columns:1fr}.metric b{font-size:30px}.hero-row .btn{width:100%}}
</style></head><body>
<div id="ai-nav" data-page="diagnosis-results"></div>
<script src="./assets/nav.js"></script>
<div class="ai-main"><div class="ai-wrap">
<section id="gate" class="ai-card glow gate"><span class="ai-tag">ADMIN ONLY</span><h1 style="margin-top:14px">集計ページ</h1><p>診断結果は管理者のみ閲覧できます。社内Googleアカウントでログインしてください。</p><button id="login" class="btn">Googleでログイン</button><p id="error"></p></section>
<main id="dashboard" class="hidden"><div class="ai-hero hero-row"><div><div class="ai-eyebrow">AI Quest / Insights</div><h1 class="ai-title">AI活用<span class="grad">レポート</span></h1><p id="updated" class="ai-lead">最新回答を集計しています</p></div><button id="csv" class="btn">CSVダウンロード ↓</button></div><div class="grid"><div class="ai-card metric accent"><b id="total">0</b><span>回答者数</span></div><div class="ai-card metric"><b id="average">—</b><span>平均レベル</span></div><div class="ai-card metric"><b id="daily">—</b><span>1日3回以上の利用者</span></div><div class="ai-card metric"><b id="want">—</b><span>有料AIに関心あり</span></div><div class="ai-card wide section"><h2>レベル分布</h2><div id="levels" class="levels"></div></div><div class="ai-card wide section"><h2>ChatGPT / Claude 利用状況・希望</h2><div id="interest" class="interest"></div></div></div><div class="ai-card tablecard"><h2>回答一覧</h2><div class="ai-table-wrap"><table class="ai-table"><thead><tr><th>氏名</th><th>部署</th><th>レベル</th><th>スコア</th><th>前回比</th><th>利用頻度</th><th>有料AI利用状況・希望</th><th>利用アカウント</th><th>回答日時</th><th>全回答</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" class="state"></p></div></main>
</div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,collection,getDocs}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import{firebaseConfig}from"./firebase-config.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider(),$=id=>document.getElementById(id);let data=[];
const interestLabels={using:"会社アカウントで使用中",strong:"ぜひ使いたい",interested:"用途が合えば",trial:"説明・体験希望",gemini:"Geminiで十分",unsure:"判断できない"},accountLabels={company:"会社アカウントのみ",both:"会社・個人の両方",personal:"個人アカウントのみ",none:"業務利用なし",unknown:"不明"},freq=["ほとんど使わない","週に数回／1日1回未満","1〜2回/日","3〜5回/日","6回以上/日"];
const questionLabels={frequency:"1日の利用頻度",scenes:"利用業務の幅",firstChoice:"AIを選択肢に入れる",prompt:"目的・条件を整理した依頼",iterate:"回答の改善",workspace:"Workspace連携",quality:"作業の質・速さ",reuse:"使い方の再利用",advanced:"複数ステップでの活用",verify:"回答の確認",security:"入力情報の判断",ownership:"最終責任の意識",share:"コツの共有",experiment:"新しい使い方の実験",paidTools:"有料AI利用状況・希望",accountType:"利用アカウント",department:"所属部署"};
const scaleLabels={frequency:freq,scenes:["まだ使っていない","1つの用途だけ","2つの用途","3〜4つの用途","5つ以上／業務の標準"],firstChoice:["入れない","ほぼ入れない","時々入れる","よく入れる","常に最適手段として検討"],prompt:["短い単語だけ","目的だけ伝える","背景も伝える","形式や条件も指定","例示しながら改善できる"],iterate:["諦める","同じ質問を繰り返す","少し言い換える","不足点を伝えて修正","分解・比較・検証を重ねる"],workspace:["知らない","知っているが未使用","1サービスで使用","複数サービスで使用","業務フローに定着"],quality:["変化なし","まだ分からない","少し改善","明確に改善","大幅改善・成果を説明できる"],reuse:["残していない","個人メモ程度","時々再利用","整理して継続利用","チームで共有・改善"],advanced:["使わない","単発作業のみ","2工程で使う","複数工程で使う","ワークフロー全体を設計"],verify:["そのまま使う","ほぼ確認しない","重要箇所だけ確認","根拠を確認","複数情報源で検証・明示"],security:["意識していない","少し不安","基本は理解","入力前に必ず判断","周囲にも注意点を説明"],ownership:["意識していない","あまり意識しない","理解している","常に見直す","判断理由も説明できる"],share:["共有しない","聞かれた時だけ","時々共有","積極的に共有","相談に乗りチームを支援"],experiment:["試さない","年に数回","月に1回","週に1回","日常的に試して振り返る"]};
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const stamp=d=>d.submittedAt?.toDate?.()||new Date((d.submittedAt?.seconds||0)*1000);const answerText=(key,value)=>key==="paidTools"?(interestLabels[value]||value):key==="accountType"?(accountLabels[value]||value):(scaleLabels[key]?.[value]??value??"未回答");
$("login").onclick=()=>signInWithPopup(auth,provider).catch(()=>$("error").textContent="ログインできませんでした。");
onAuthStateChanged(auth,async user=>{if(!user)return;try{await getDoc(doc(db,"aiStudy_settings","access"));const [history,latest]=await Promise.all([getDocs(collection(db,"aiStudy_aiDiagnosticResponses")),getDocs(collection(db,"aiStudy_aiDiagnostics"))]);data=history.docs.map(d=>({...d.data(),responseId:d.id}));const historicalUsers=new Set(data.map(d=>d.uid));latest.docs.forEach(d=>{if(!historicalUsers.has(d.data().uid))data.push({...d.data(),responseId:`latest-${d.id}`,legacy:true})});$("gate").classList.add("hidden");$("dashboard").classList.remove("hidden");render()}catch(e){console.error(e);$("error").textContent="このアカウントには集計結果の閲覧権限がありません。"}});
function render(){data.sort((a,b)=>stamp(b)-stamp(a));const n=data.length,avg=n?data.reduce((s,d)=>s+(d.level||0),0)/n:0,daily=n?data.filter(d=>(d.answers?.frequency||0)>=3).length/n*100:0,interested=n?data.filter(d=>["strong","interested","trial"].includes(d.paidToolsInterest)).length/n*100:0;$("total").textContent=n;$("average").textContent=n?avg.toFixed(1):"—";$("daily").textContent=n?`${Math.round(daily)}%`:"—";$("want").textContent=n?`${Math.round(interested)}%`:"—";$("updated").textContent=`${new Date().toLocaleString("ja-JP")} 時点 · 全回答履歴`;
const counts=[1,2,3,4,5].map(l=>data.filter(d=>d.level===l).length),max=Math.max(...counts,1);$("levels").innerHTML=counts.map((c,i)=>`<div class="level"><i style="--h:${c/max*120}px"></i><b>LV.${i+1}</b><small>${c}回答</small></div>`).join("");const keys=["using","strong","interested","trial","gemini","unsure"];$("interest").innerHTML=keys.map(k=>{const c=data.filter(d=>d.paidToolsInterest===k).length;return `<div class="interest-row"><span>${interestLabels[k]}</span><div class="track"><i style="--w:${n?c/n*100:0}%"></i></div><b>${c}</b></div>`}).join("");
const byUser={};[...data].sort((a,b)=>stamp(a)-stamp(b)).forEach(d=>{const prev=byUser[d.uid];d.delta=prev==null?null:d.score-prev;byUser[d.uid]=d.score});$("rows").innerHTML=data.map((d,i)=>{const delta=d.delta==null?"初回":`${d.delta>0?"+":""}${d.delta}点`,cls=d.delta>0?"up":d.delta<0?"down":"";const details=Object.keys(questionLabels).map(k=>`<div class="answer-item"><b>${questionLabels[k]}</b>${esc(answerText(k,d.answers?.[k]??(k==="department"?d.department:undefined)))}</div>`).join("");return `<tr><td>${esc(d.name||d.email)}</td><td>${esc(d.department||"—")}</td><td><span class="lv">LV.${d.level} ${esc(d.levelName||"")}</span></td><td>${d.score}/56</td><td><span class="growth ${cls}">${delta}</span></td><td>${esc(freq[d.answers?.frequency]||"—")}</td><td>${esc(interestLabels[d.paidToolsInterest]||"—")}</td><td>${esc(accountLabels[d.answers?.accountType]||"—")}</td><td>${stamp(d).getTime()?stamp(d).toLocaleString("ja-JP"):"—"}</td><td><button class="detailbtn" data-detail="${i}" aria-expanded="false">回答を見る</button></td></tr><tr id="detail-${i}" class="answer-detail hidden"><td colspan="10"><div class="answer-grid">${details}</div></td></tr>`}).join("");$("empty").textContent=n?"":"まだ回答がありません。"}
$("rows").onclick=e=>{const b=e.target.closest("[data-detail]");if(!b)return;const row=$(`detail-${b.dataset.detail}`),open=!row.classList.toggle("hidden");b.textContent=open?"閉じる":"回答を見る";b.setAttribute("aria-expanded",open)};
$("csv").onclick=()=>{const answerKeys=Object.keys(questionLabels),cols=["回答ID","氏名","メール","部署","レベル","レベル名","スコア","前回比","回答日時",...answerKeys.map(k=>questionLabels[k])],rows=data.map(d=>[d.responseId,d.name,d.email,d.department,d.level,d.levelName,d.score,d.delta??"初回",stamp(d).toISOString(),...answerKeys.map(k=>answerText(k,d.answers?.[k]??(k==="department"?d.department:undefined)))]);const csv="\ufeff"+[cols,...rows].map(r=>r.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`ai-diagnosis-history-${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(a.href)};
</script></body></html>
